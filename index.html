<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiweiHome</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>

    <style>
        :root {
            --bg-body: #f0f2f5;
            --text-primary: #1a1a2e;
            --text-secondary: #444;
            --text-muted: #888;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.5);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --card-hover-shadow: 0 16px 48px rgba(0, 0, 0, 0.10);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.4);
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.25);
            --pinned-tag-bg: rgba(0, 0, 0, 0.06);
            --pinned-tag-text: #888;
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --transition-base: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            --max-width: 1024px;
            --font-family: 'Inter', -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            --section-gap: 56px;
        }

        [data-theme="dark"] {
            --bg-body: #0a0a0f;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.4);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --card-hover-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --pinned-tag-bg: rgba(255, 255, 255, 0.06);
            --pinned-tag-text: rgba(255, 255, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-family);
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                        color 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .bg-glow::before,
        .bg-glow::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            transition: all 2s ease;
        }
        .bg-glow::before {
            width: 600px;
            height: 600px;
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(88, 166, 255, 0.15) 0%, transparent 70%);
        }
        .bg-glow::after {
            width: 500px;
            height: 500px;
            bottom: -10%;
            right: -10%;
            background: radial-gradient(circle, rgba(255, 180, 60, 0.10) 0%, transparent 70%);
        }
        [data-theme="dark"] .bg-glow::before {
            background: radial-gradient(circle, rgba(88, 166, 255, 0.20) 0%, transparent 70%);
        }
        [data-theme="dark"] .bg-glow::after {
            background: radial-gradient(circle, rgba(255, 180, 60, 0.12) 0%, transparent 70%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px 60px;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 20px 0 16px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 32px;
            transition: border-color 0.5s ease;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }
        .header-left .logo span { color: var(--accent); }
        .header-left .tagline {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
            transition: color 0.5s ease;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-right a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 30px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            transition: all var(--transition-base);
            backdrop-filter: blur(12px);
        }
        .header-right a:hover {
            background: var(--card-bg);
            border-color: var(--accent);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        .theme-toggle {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all var(--transition-base);
            font-family: inherit;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .theme-toggle:hover {
            background: var(--card-bg);
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .theme-toggle:active { transform: scale(0.93); }
        .theme-toggle .theme-label { font-size: 12px; font-weight: 500; }

        .hero {
            padding: 40px 0 48px;
            text-align: center;
            position: relative;
        }
        .hero-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--card-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            transition: all var(--transition-spring);
            cursor: pointer;
            background: var(--bg-body);
        }
        .hero-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
        }
        .hero-title {
            font-size: clamp(40px, 8vw, 80px);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.05;
            margin-top: 16px;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }
        .hero-title .highlight {
            background: linear-gradient(135deg, var(--accent), #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-sub {
            font-size: clamp(16px, 2vw, 22px);
            color: var(--text-secondary);
            margin-top: 8px;
            font-weight: 400;
            transition: color 0.5s ease;
        }
        .hero-signature {
            max-width: 640px;
            margin: 20px auto 0;
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-secondary);
            transition: color 0.5s ease;
        }
        .hero-signature img {
            max-width: 100%;
            max-height: 300px;
            border-radius: var(--radius-md);
            margin: 8px 0;
        }
        .hero-social {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
        }
        .hero-social a {
            padding: 8px 20px;
            border-radius: 40px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition-base);
            backdrop-filter: blur(12px);
            cursor: pointer;
        }
        .hero-social a:hover {
            background: var(--card-bg);
            border-color: var(--accent);
            color: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: var(--section-gap);
            margin-bottom: 20px;
            transition: color 0.5s ease;
        }
        .section-title .count { font-weight: 400; opacity: 0.6; }
        .section-title:first-of-type { margin-top: 0; }

        .works-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 720px) {
            .works-grid { grid-template-columns: 1fr; gap: 18px; }
        }

        .work-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 24px 24px 22px;
            backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            transition: all var(--transition-spring);
            cursor: default;
            position: relative;
            overflow: hidden;
        }
        .work-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--card-hover-shadow);
            border-color: var(--accent);
        }
        .work-card:active { transform: scale(0.97); transition-duration: 0.08s; }

        .work-card .work-cover {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: var(--bg-body);
            border-radius: var(--radius-sm);
            margin-bottom: 14px;
            transition: transform var(--transition-base);
            cursor: pointer;
            display: block;
        }
        .work-card:hover .work-cover { transform: scale(1.02); }

        .work-card .work-name {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }
        .work-card .work-tags {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
            transition: color 0.5s ease;
        }
        .work-card .work-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-top: 8px;
            transition: color 0.5s ease;
        }
        .work-card .work-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
        }
        .work-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all var(--transition-base);
            font-family: inherit;
            background: var(--accent);
            color: #fff;
        }
        .work-link:hover {
            background: #4a8edb;
            box-shadow: 0 4px 20px var(--accent-glow);
            transform: translateY(-2px);
        }
        .work-link:active { transform: scale(0.93); }
        .work-link.loading {
            background: #555;
            cursor: wait;
            pointer-events: none;
        }

        .platform-switcher {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--glass-bg);
            padding: 4px 12px 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            cursor: pointer;
            transition: all var(--transition-base);
            backdrop-filter: blur(8px);
            user-select: none;
            font-family: inherit;
        }
        .platform-switcher:hover {
            border-color: var(--accent);
            background: var(--card-bg);
            transform: translateY(-1px);
        }
        .platform-switcher:active { transform: scale(0.92); }
        .platform-switcher .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .platform-switcher .dot.netlify { background: #00ad9f; }
        .platform-switcher .dot.github { background: #6e5494; }
        .platform-switcher .label {
            font-weight: 500;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .platform-switcher .arrow {
            font-size: 10px;
            color: var(--text-muted);
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .platform-switcher:hover .arrow { transform: translateX(3px) rotate(180deg); }

        @keyframes pulseDot {
            0% { transform: scale(1); }
            50% { transform: scale(1.6); }
            100% { transform: scale(1); }
        }
        .platform-switcher .dot.switching { animation: pulseDot 0.4s ease; }

        .fallback-link {
            font-size: 11px;
            color: var(--text-muted);
            text-decoration: none;
            border-bottom: 1px dotted var(--text-muted);
            transition: all var(--transition-base);
            cursor: pointer;
        }
        .fallback-link:hover {
            color: var(--text-secondary);
            border-color: var(--text-secondary);
        }

        /* ===== 朋友圈预览（从 CiweiBlog 加载） ===== */
        .recent-posts {
            margin: 6px 0 14px;
            padding: 12px 14px;
            background: var(--glass-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--card-border);
            transition: all var(--transition-base);
        }
        .recent-posts:hover {
            background: var(--card-bg);
            border-color: var(--accent);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .recent-posts .rp-title {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }
        .recent-posts .rp-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: none;
            border-bottom: 1px dashed var(--card-border);
            transition: all var(--transition-base);
            border-radius: 6px;
            position: relative;
            cursor: pointer;
        }
        .recent-posts .rp-item:last-child { border-bottom: none; }
        .recent-posts .rp-item::before {
            content: '→';
            position: absolute;
            left: -2px;
            opacity: 0;
            transition: all var(--transition-base);
            transform: translateX(-6px);
            color: var(--accent);
        }
        .recent-posts .rp-item:hover {
            color: var(--text-primary);
            padding-left: 16px;
            background: var(--card-bg);
            border-radius: 6px;
        }
        .recent-posts .rp-item:hover::before {
            opacity: 1;
            transform: translateX(0);
        }
        .recent-posts .rp-item .rp-date {
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-left: 12px;
            transition: color var(--transition-base);
        }
        .recent-posts .rp-item:hover .rp-date { color: var(--text-muted); }
        .recent-posts .rp-empty {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            padding: 8px 0;
        }
        .recent-posts .rp-loading {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            padding: 8px 0;
            animation: pulseText 1.5s ease-in-out infinite;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .modal,
        .qr-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 20px;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(6px);
        }
        .modal.active,
        .qr-modal.active { display: flex; }

        .modal { background: rgba(0, 0, 0, 0.85); }
        .qr-modal { background: rgba(0, 0, 0, 0.75); }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            animation: scaleIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .modal .close-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        .qr-modal .qr-content {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px 24px 20px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: scaleIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: default;
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
        }
        .qr-modal .qr-content .qr-label {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        .qr-modal .qr-content img {
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        .qr-modal .qr-content .qr-close-hint {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .modal.closing { animation: fadeOut 0.25s ease forwards; }
        .modal.closing img { animation: scaleOut 0.25s ease forwards; }
        .qr-modal.closing { animation: fadeOut 0.2s ease forwards; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes scaleIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes scaleOut { from { transform: scale(1); opacity: 1; } to { transform: scale(0.85); opacity: 0; } }

        .footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            transition: all 0.5s ease;
            letter-spacing: 0.3px;
        }
        .footer .heart {
            color: #ef4444;
            display: inline-block;
            animation: heartbeat 1.8s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        .reveal { opacity: 0; transform: translateY(40px); }

        .empty-state {
            text-align: center;
            padding: 32px 20px;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(12px);
            transition: all 0.5s ease;
        }
        .empty-state .empty-icon { font-size: 32px; margin-bottom: 6px; }
        .empty-state .empty-text { font-size: 14px; }

        @media (max-width: 600px) {
            .container { padding: 0 16px 40px; }
            .header { padding: 14px 0 12px; }
            .header-left .logo { font-size: 19px; }
            .header-left .tagline { font-size: 12px; }
            .header-right a { font-size: 12px; padding: 4px 10px; }
            .theme-toggle { padding: 4px 10px; font-size: 12px; }
            .theme-toggle .theme-label { font-size: 11px; }
            .hero { padding: 20px 0 28px; }
            .hero-avatar { width: 72px; height: 72px; }
            .hero-signature { font-size: 14px; line-height: 1.7; }
            .section-title { font-size: 12px; margin-top: 40px; margin-bottom: 14px; }
            .work-card { padding: 16px 16px 18px; }
            .work-card .work-name { font-size: 17px; }
            .work-card .work-actions { flex-direction: column; align-items: stretch; }
            .work-link { justify-content: center; }
            .platform-switcher { justify-content: center; padding: 6px 12px; }
            .recent-posts .rp-item { font-size: 13px; flex-wrap: wrap; }
        }
        @media (max-width: 400px) {
            .hero-title { font-size: 32px; }
            .hero-social a { font-size: 12px; padding: 6px 14px; }
            .work-card .work-desc { font-size: 13px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
            .reveal { opacity: 1 !important; transform: none !important; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">

        <header class="header">
            <div class="header-left">
                <div class="logo">🦔 <span>CiweiHome</div>
                <span class="tagline" id="headerTagline">独立开发者</span>
            </div>
            <div class="header-right">
                <a href="https://github.com/xiaociwei01" target="_blank">GitHub</a>
                <button class="theme-toggle" id="themeToggle" title="切换主题">
                    <span id="themeIcon">🌙</span>
                    <span class="theme-label" id="themeLabel">深色</span>
                </button>
            </div>
        </header>

        <section class="hero">
            <img class="hero-avatar reveal" id="heroAvatar" src="ciweitouxiang.jpg" alt="小刺猬头像" loading="lazy" onclick="openAvatarModal()" />
            <h1 class="hero-title reveal">
                <span class="highlight" id="heroTitle">LouFoong</span>
            </h1>
            <p class="hero-sub reveal" id="heroSub">独立开发者</p>
            <div class="hero-signature reveal" id="heroSignature">
           <p>欢迎来看我的站点<p>
           <p>本站点使用 HTML+CSS+JavaScript 语言开发 评论系统由 Cusdis 实现<p>
           <p>加载速度有点慢 请耐心等等 谅解一下<p>
            </div>
            <div class="hero-social reveal">
                <a id="socialWechat">💬 微信</a>
                <a id="socialQQ">🐧 QQ</a>
            </div>
        </section>

        <!-- ===== 作品区（硬编码） ===== -->
        <div class="section-title reveal">🧰 我的作品</div>
        <div class="works-grid" id="worksGrid">
            <!-- 由 JS 硬编码渲染 -->
        </div>

        <!-- ===== 朋友圈区（从 CiweiBlog 加载） ===== -->
        <div class="section-title reveal">🦔 开发者的小朋友圈</div>
        <div class="works-grid" id="friendsGrid">
            <div class="work-card reveal" id="work-friends" style="grid-column:1/-1;">
                <div class="work-cover" onclick="openImageModal(this)">
                    <img src="FriendQuan.jpg" alt="朋友圈封面图" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:var(--radius-sm);">
                </div>
                <div class="work-body" style="padding-top:14px;">
                    <div class="work-name">📝 开发者的小朋友圈</div>
                    <div class="work-tags">偶尔写写，记录一些瞬间</div>
                    <div class="recent-posts" id="recentPosts">
                        <div class="rp-title">📖 最近更新</div>
                        <div class="rp-loading">加载中...</div>
                    </div>
                    <div class="work-actions">
                        <button class="work-link" id="btn-friends" onclick="smartNavigate('friends')">
                            📝 进入朋友圈
                        </button>
                        <div class="platform-switcher" id="switcher-friends" onclick="togglePlatform('friends')" title="点击切换平台">
                            <span class="dot netlify" id="dot-friends"></span>
                            <span class="label" id="label-friends">Netlify</span>
                            <span class="arrow">⇄</span>
                        </div>
                    </div>
                    <div style="margin-top:6px;font-size:12px;color:var(--text-muted);display:flex;gap:12px;flex-wrap:wrap;">
                        <span>📡 <span id="primary-label-friends">主: Netlify</span></span>
                        <a href="#" id="fallback-link-friends" class="fallback-link" onclick="directNavigate('friends', 'fallback'); return false;">🔁 备用: GitHub Pages</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer reveal">
            <span class="heart">✦</span> CiweiHome · 2026 <span class="heart">✦</span>
        </div>

    </div>

    <div class="modal" id="imageModal" onclick="closeImageModal()">
        <img id="modalImage" src="" alt="大图">
        <div class="close-hint">点击任意处关闭</div>
    </div>

    <div class="qr-modal" id="qrModal" onclick="closeQR()">
        <div class="qr-content" onclick="event.stopPropagation()">
            <div class="qr-label" id="qrLabel">微信二维码</div>
            <img id="qrImage" src="" alt="二维码">
            <div class="qr-close-hint">点击任意处关闭</div>
        </div>
    </div>

    <script>
        // ================================================================
        // 配置（原版逻辑）
        // ================================================================
        const BLOG_REPO = 'xiaociwei01/CiweiBlog';
        const BLOG_API = `https://api.github.com/repos/${BLOG_REPO}/contents/posts`;
        const DETAIL_PAGE = 'https://xiaociwei01.github.io/CiweiBlog/Xiangqingye.html';
        const THEME_KEY = 'ciwei_home_theme';

        // 硬编码作品
        const WORKS = [{
            id: 'solar',
            name: '3D太阳系',
            tags: 'Three.js · 开普勒轨道 · 哈勃望远镜 · 旅行者一号',
            desc: '真实光照 · 椭圆轨道 · 行星轴倾斜 · 土星环 · 破坏工具箱 · 哈勃望远镜模式 · 旅行者一号深空飞行轨迹路线图',
            cover: 'xiaotaiyang.jpg',
            primaryLink: 'https://xiaotaiyang.netlify.app',
            fallbackLink: 'https://xiaociwei01.github.io/xiaotaiyang/'
        }, {
            id: 'lunar',
            name: '3D地月系',
            tags: '开普勒轨道 · 月相 · ISS · 天宫空间站',
            desc: '地球开普勒公转 · 节气跳转 · 日食/月食实时检测 · 月相模拟 · ISS 与天宫双空间站 · 地轴倾斜。',
            cover: 'diyue.jpg',
            primaryLink: 'https://diyue.netlify.app',
            fallbackLink: 'https://xiaociwei01.github.io/diyue/'
        }];

        const LINK_CONFIG = {
            solar: {
                primary: 'https://xiaotaiyang.netlify.app',
                fallback: 'https://xiaociwei01.github.io/xiaotaiyang/',
                selected: 'primary'
            },
            lunar: {
                primary: 'https://diyue.netlify.app',
                fallback: 'https://xiaociwei01.github.io/diyue/',
                selected: 'primary'
            },
            friends: {
                primary: 'https://ciweihome.netlify.app/FriendQuan.html',
                fallback: 'https://xiaociwei01.github.io/CiweiHome/FriendQuan.html',
                selected: 'primary'
            }
        };

        const $ = id => document.getElementById(id);
        const worksGrid = $('worksGrid');

        // ================================================================
        // 工具函数
        // ================================================================
        function buildCdnUrl(path) {
            if (!path) return '';
            if (path.startsWith('http://') || path.startsWith('https://')) return path;
            const localImages = ['xiaotaiyang.jpg', 'diyue.jpg', 'FriendQuan.jpg', 'ciweitouxiang.jpg', 'wechat_qr.jpg', 'qq_qr.jpg'];
            if (localImages.includes(path)) {
                return `https://xiaociwei01.github.io/CiweiHome/${path}`;
            }
            return `https://cdn.jsdelivr.net/gh/xiaociwei01/CiweiManager@main/${path}`;
        }

        function getCurrentLink(key) {
            const config = LINK_CONFIG[key];
            return config.selected === 'primary' ? config.primary : config.fallback;
        }

        function getCurrentPlatform(key) {
            const config = LINK_CONFIG[key];
            return config.selected === 'primary' ? 'Netlify' : 'GitHub Pages';
        }

        function updatePlatformUI(key) {
            const config = LINK_CONFIG[key];
            const isPrimary = config.selected === 'primary';
            const dot = document.getElementById('dot-' + key);
            const label = document.getElementById('label-' + key);
            const primaryLabel = document.getElementById('primary-label-' + key);

            if (dot) {
                dot.className = 'dot ' + (isPrimary ? 'netlify' : 'github');
            }
            if (label) {
                label.textContent = isPrimary ? 'Netlify' : 'GitHub Pages';
            }
            if (primaryLabel) {
                primaryLabel.textContent = isPrimary ? '主: Netlify' : '主: GitHub Pages';
            }

            const fallbackLink = document.getElementById('fallback-link-' + key);
            if (fallbackLink) {
                const fbLabel = isPrimary ? 'GitHub Pages' : 'Netlify';
                fallbackLink.textContent = '🔁 备用: ' + fbLabel;
                const target = isPrimary ? config.fallback : config.primary;
                fallbackLink.href = target;
                fallbackLink.onclick = function(e) {
                    e.preventDefault();
                    directNavigate(key, 'fallback');
                };
            }
        }

        function togglePlatform(key) {
            const config = LINK_CONFIG[key];
            config.selected = config.selected === 'primary' ? 'fallback' : 'primary';

            const dot = document.getElementById('dot-' + key);
            if (dot) {
                dot.classList.add('switching');
                setTimeout(() => dot.classList.remove('switching'), 400);
            }

            updatePlatformUI(key);
            const btn = document.getElementById('btn-' + key);
            if (btn) {
                btn.title = '当前目标: ' + getCurrentPlatform(key);
            }
        }

        function smartNavigate(key) {
            const config = LINK_CONFIG[key];
            const btn = document.getElementById('btn-' + key);
            const originalText = btn.innerHTML;

            btn.classList.add('loading');
            btn.innerHTML = '⏳ 检测中...';

            const primaryUrl = config.primary;
            const fallbackUrl = config.fallback;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);

            fetch(primaryUrl, {
                    method: 'HEAD',
                    mode: 'no-cors',
                    signal: controller.signal
                })
                .then(() => {
                    clearTimeout(timeoutId);
                    btn.classList.remove('loading');
                    btn.innerHTML = originalText;
                    window.open(primaryUrl, '_blank');
                })
                .catch(() => {
                    clearTimeout(timeoutId);
                    config.selected = 'fallback';
                    updatePlatformUI(key);
                    btn.classList.remove('loading');
                    btn.innerHTML = originalText;
                    window.open(fallbackUrl, '_blank');
                });
        }

        function directNavigate(key, target) {
            const config = LINK_CONFIG[key];
            const url = target === 'fallback' ? config.fallback : config.primary;
            window.open(url, '_blank');
        }

        // ================================================================
        // 渲染作品（硬编码）
        // ================================================================
        function renderWorks() {
            let html = '';
            WORKS.forEach((work) => {
                const cfg = LINK_CONFIG[work.id];
                const isPrimary = cfg.selected === 'primary';
                const dotClass = isPrimary ? 'netlify' : 'github';
                const labelText = isPrimary ? 'Netlify' : 'GitHub Pages';

                html += `
                    <div class="work-card reveal" id="work-${work.id}">
                        <img class="work-cover" src="${work.cover}" alt="${work.name}展示图" loading="lazy" onclick="openImageModal(this.src)" />
                        <div class="work-name">${work.name}</div>
                        <div class="work-tags">${work.tags}</div>
                        <div class="work-desc">${work.desc}</div>
                        <div class="work-actions">
                            <a class="work-link" id="work-link-${work.id}" href="${work.primaryLink}" target="_blank">🚀 进入</a>
                            <button class="platform-switcher" onclick="togglePlatform('${work.id}')" title="点击切换平台">
                                <span class="dot ${dotClass}" id="dot-${work.id}"></span>
                                <span class="label" id="label-${work.id}">${labelText}</span>
                                <span class="arrow">⇄</span>
                            </button>
                        </div>
                        <div style="margin-top:6px;font-size:12px;color:var(--text-muted);display:flex;gap:12px;flex-wrap:wrap;">
                            <span>📡 <span id="primary-label-${work.id}">主: ${labelText}</span></span>
                            <a href="#" class="fallback-link" onclick="directNavigate('${work.id}', 'fallback'); return false;">🔁 备用: ${labelText === 'Netlify' ? 'GitHub Pages' : 'Netlify'}</a>
                        </div>
                    </div>
                `;
            });

            worksGrid.innerHTML = html;

            Object.keys(LINK_CONFIG).forEach(key => {
                if (key !== 'friends') {
                    updatePlatformUI(key);
                    const btn = document.getElementById('btn-' + key);
                    if (btn) {
                        btn.title = '当前目标: ' + getCurrentPlatform(key);
                    }
                }
            });
        }

        // ================================================================
        // 加载朋友圈（从 CiweiBlog 读取 - 原版逻辑）
        // ================================================================
        async function fetchRecentPosts() {
            const container = document.getElementById('recentPosts');
            try {
                const res = await fetch(BLOG_API);
                if (!res.ok) throw new Error('无法读取文章列表');
                const files = await res.json();
                const posts = files.filter(f => f.name.endsWith('.md'));

                if (posts.length === 0) {
                    container.innerHTML = `
                        <div class="rp-title">📖 最近更新</div>
                        <div class="rp-empty">还没有文章，写一篇吧 ✍️</div>
                    `;
                    return;
                }

                posts.sort((a, b) => b.name.localeCompare(a.name));
                const recent = posts.slice(0, 3);

                const tasks = recent.map(async (post) => {
                    try {
                        const contentRes = await fetch(post.download_url);
                        const contentText = await contentRes.text();
                        const titleMatch = contentText.match(/title:\s*(.+)/);
                        const dateMatch = contentText.match(/date:\s*(.+)/);
                        const title = titleMatch ? titleMatch[1].trim() : post.name.replace('.md', '');
                        const date = dateMatch ? dateMatch[1].trim() : '未知日期';
                        // 只取日期部分，去掉时间
                        const dateOnly = date.includes(' ') ? date.split(' ')[0] : date;
                        return { title, date: dateOnly, filename: post.name };
                    } catch (e) {
                        return null;
                    }
                });

                const results = await Promise.all(tasks);
                const validPosts = results.filter(p => p !== null);

                if (validPosts.length === 0) {
                    container.innerHTML = `
                        <div class="rp-title">📖 最近更新</div>
                        <div class="rp-empty">还没有文章，写一篇吧 ✍️</div>
                    `;
                    return;
                }

                let html = `<div class="rp-title">📖 最近更新</div>`;
                for (const post of validPosts) {
                    html += `
                        <a href="${DETAIL_PAGE}?file=${encodeURIComponent(post.filename)}" target="_blank" class="rp-item">
                            <span>${post.title}</span>
                            <span class="rp-date">${post.date}</span>
                        </a>
                    `;
                }
                container.innerHTML = html;

                const items = container.querySelectorAll('.rp-item');
                items.forEach((item, index) => {
                    item.style.opacity = '0';
                    item.style.transform = 'translateY(8px)';
                    item.style.transition = `opacity 0.3s ease ${index * 0.1}s, transform 0.3s ease ${index * 0.1}s, padding-left 0.25s ease, color 0.25s ease`;
                    requestAnimationFrame(() => {
                        item.style.opacity = '1';
                        item.style.transform = 'translateY(0)';
                    });
                });
            } catch (err) {
                container.innerHTML = `
                    <div class="rp-title">📖 最近更新</div>
                    <div class="rp-empty">加载失败，请稍后重试</div>
                `;
            }
        }

        // ================================================================
        // 图片/二维码模态框
        // ================================================================
        function openImageModal(src) {
            if (!src) return;
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = src;
            modal.classList.remove('closing');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function openAvatarModal() {
            const avatarImg = document.getElementById('heroAvatar');
            if (!avatarImg) return;
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = avatarImg.src;
            modalImg.alt = avatarImg.alt || '头像';
            modal.classList.remove('closing');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('closing');
            setTimeout(() => {
                modal.classList.remove('active');
                modal.classList.remove('closing');
                document.body.style.overflow = '';
            }, 250);
        }

        function openQR(type) {
            const modal = document.getElementById('qrModal');
            const qrImg = document.getElementById('qrImage');
            const qrLabel = document.getElementById('qrLabel');

            if (type === 'wechat') {
                qrImg.src = 'wechat_qr.jpg';
                qrLabel.textContent = '📱 微信二维码';
            } else if (type === 'qq') {
                qrImg.src = 'qq_qr.jpg';
                qrLabel.textContent = '💬 QQ二维码';
            } else {
                return;
            }

            modal.classList.remove('closing');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeQR() {
            const modal = document.getElementById('qrModal');
            modal.classList.add('closing');
            setTimeout(() => {
                modal.classList.remove('active');
                modal.classList.remove('closing');
                document.body.style.overflow = '';
            }, 200);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeImageModal();
                closeQR();
            }
        });

        // ================================================================
        // 微信/QQ 点击
        // ================================================================
        document.getElementById('socialWechat').addEventListener('click', function(e) {
            e.preventDefault();
            openQR('wechat');
        });
        document.getElementById('socialQQ').addEventListener('click', function(e) {
            e.preventDefault();
            openQR('qq');
        });

        // ================================================================
        // 主题切换
        // ================================================================
        function getPreferredTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            if (saved === 'dark' || saved === 'light') return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            if (theme === 'dark') {
                icon.textContent = '☀️';
                label.textContent = '浅色';
            } else {
                icon.textContent = '🌙';
                label.textContent = '深色';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        applyTheme(getPreferredTheme());
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem(THEME_KEY)) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // ================================================================
        // GSAP 滚动入场动画（双向触发）
        // ================================================================
        function initGSAP() {
            if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
                setTimeout(initGSAP, 500);
                return;
            }

            gsap.registerPlugin(ScrollTrigger);

            document.querySelectorAll('.hero .reveal').forEach((el, i) => {
                gsap.fromTo(el, {
                        opacity: 0,
                        y: 40,
                        scale: 0.96,
                    }, {
                        opacity: 1,
                        y: 0,
                        scale: 1,
                        duration: 1.0,
                        ease: 'power3.out',
                        delay: i * 0.08,
                        scrollTrigger: {
                            trigger: el,
                            start: 'top 90%',
                            end: 'top 40%',
                            scrub: 1.0,
                            toggleActions: 'play reverse play reverse',
                        },
                    }
                );
            });

            document.querySelectorAll('.section-title.reveal').forEach((el) => {
                gsap.fromTo(el, {
                        opacity: 0,
                        y: 30,
                    }, {
                        opacity: 1,
                        y: 0,
                        duration: 0.8,
                        ease: 'power3.out',
                        scrollTrigger: {
                            trigger: el,
                            start: 'top 88%',
                            end: 'top 50%',
                            scrub: 0.8,
                            toggleActions: 'play reverse play reverse',
                        },
                    }
                );
            });

            document.querySelectorAll('.work-card.reveal').forEach((el, i) => {
                gsap.fromTo(el, {
                        opacity: 0,
                        y: 50,
                        scale: 0.94,
                    }, {
                        opacity: 1,
                        y: 0,
                        scale: 1,
                        duration: 1.0,
                        ease: 'power4.out',
                        delay: i * 0.06,
                        scrollTrigger: {
                            trigger: el,
                            start: 'top 92%',
                            end: 'top 40%',
                            scrub: 1.0,
                            toggleActions: 'play reverse play reverse',
                        },
                    }
                );
            });

            const friendCard = document.querySelector('#work-friends.reveal');
            if (friendCard) {
                gsap.fromTo(friendCard, {
                        opacity: 0,
                        y: 50,
                        scale: 0.94,
                    }, {
                        opacity: 1,
                        y: 0,
                        scale: 1,
                        duration: 1.0,
                        ease: 'power4.out',
                        scrollTrigger: {
                            trigger: friendCard,
                            start: 'top 92%',
                            end: 'top 40%',
                            scrub: 1.0,
                            toggleActions: 'play reverse play reverse',
                        },
                    }
                );
            }

            const footer = document.querySelector('.footer.reveal');
            if (footer) {
                gsap.fromTo(footer, {
                        opacity: 0,
                        y: 30,
                    }, {
                        opacity: 1,
                        y: 0,
                        duration: 0.8,
                        ease: 'power3.out',
                        scrollTrigger: {
                            trigger: footer,
                            start: 'top 90%',
                            end: 'top 60%',
                            scrub: 0.8,
                            toggleActions: 'play reverse play reverse',
                        },
                    }
                );
            }

            const avatar = document.querySelector('.hero-avatar');
            if (avatar) {
                gsap.fromTo(avatar, {
                        opacity: 0,
                        scale: 0.8,
                        rotation: -3,
                    }, {
                        opacity: 1,
                        scale: 1,
                        rotation: 0,
                        duration: 1.2,
                        ease: 'power4.out',
                        scrollTrigger: {
                            trigger: avatar,
                            start: 'top 95%',
                            end: 'top 50%',
                            scrub: 0.8,
                            toggleActions: 'play reverse play reverse',
                        },
                    }
                );
            }

            document.querySelectorAll('.recent-posts .rp-item').forEach((el, i) => {
                gsap.fromTo(el, {
                        opacity: 0,
                        x: -15,
                    }, {
                        opacity: 1,
                        x: 0,
                        duration: 0.6,
                        ease: 'power3.out',
                        delay: i * 0.08,
                        scrollTrigger: {
                            trigger: el,
                            start: 'top 92%',
                            end: 'top 60%',
                            scrub: 0.6,
                            toggleActions: 'play reverse play reverse',
                        },
                    }
                );
            });

            console.log('🚀 GSAP 滚动驱动动画已启动');
        }

        // ================================================================
        // 启动
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderWorks();
            fetchRecentPosts();

            updatePlatformUI('friends');
            const btn = document.getElementById('btn-friends');
            if (btn) {
                btn.title = '当前目标: ' + getCurrentPlatform('friends');
            }

            setTimeout(initGSAP, 300);
        });

        console.log('🦔 CiweiHome 已启动（视觉新版 + 朋友圈原版逻辑）');
        console.log('📦 博客仓库:', BLOG_REPO);
        console.log('📄 详情页:', DETAIL_PAGE);
    </script>

</body>
</html>
