<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>文章管理 · 后台</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ================================================================
           深色/浅色模式
        ================================================================ */
        :root {
            --bg-body: #f0f2f5;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: rgba(255, 255, 255, 0.95);
            --text-primary: #1a1a2e;
            --text-secondary: #444;
            --text-muted: #888;
            --border-color: rgba(0, 0, 0, 0.06);
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --transition-base: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.5);
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        [data-theme="dark"] {
            --bg-body: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.4);
            --border-color: rgba(255, 255, 255, 0.06);
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.5);
            --glass-border: rgba(255, 255, 255, 0.06);
        }

        /* ================================================================
           全局
        ================================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 16px 60px;
            transition: background 0.5s ease, color 0.5s ease;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        /* ===== 动态光晕背景 ===== */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .bg-glow::before,
        .bg-glow::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            transition: all 2s ease;
        }
        .bg-glow::before {
            width: 500px;
            height: 500px;
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(88, 166, 255, 0.10) 0%, transparent 70%);
        }
        .bg-glow::after {
            width: 400px;
            height: 400px;
            bottom: -10%;
            right: -10%;
            background: radial-gradient(circle, rgba(255, 180, 60, 0.08) 0%, transparent 70%);
        }
        [data-theme="dark"] .bg-glow::before {
            background: radial-gradient(circle, rgba(88, 166, 255, 0.15) 0%, transparent 70%);
        }
        [data-theme="dark"] .bg-glow::after {
            background: radial-gradient(circle, rgba(255, 180, 60, 0.10) 0%, transparent 70%);
        }

        /* ===== 容器 ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 820px;
            width: 100%;
        }

        /* ===== 顶部导航 ===== */
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 8px;
            transition: border-color 0.5s ease;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-left .logo {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }
        .nav-left .logo span {
            color: var(--accent);
        }
        .nav-left .badge {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.5s ease;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all var(--transition-base);
            font-family: inherit;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .theme-toggle:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .theme-toggle:active {
            transform: scale(0.93);
        }
        .theme-toggle .theme-label {
            font-size: 12px;
            font-weight: 500;
        }

        .token-status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all var(--transition-base);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            font-family: inherit;
        }
        .token-status-bar:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }
        .token-status-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .token-status-bar .dot.active {
            background: var(--success);
        }
        .token-status-bar .dot.inactive {
            background: var(--text-muted);
        }

        /* ===== 操作栏 ===== */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }
        .action-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .action-right {
            font-size: 12px;
            color: var(--text-muted);
            transition: color 0.5s ease;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            font-family: inherit;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: #4a8edb;
            box-shadow: 0 4px 16px var(--accent-glow);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-outline:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.25);
        }

        /* ===== 文章列表 ===== */
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .post-item {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all var(--transition-spring);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-card);
            gap: 10px;
        }
        .post-item:hover {
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .post-item.deleting {
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.25s;
        }
        .post-item .left {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }
        .post-item .left .title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            display: block;
            text-decoration: none;
            transition: color 0.5s ease;
        }
        .post-item .left .title .badge-pin {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-body);
            padding: 1px 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-left: 6px;
        }
        .post-item .left .title .badge-modified {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-body);
            padding: 1px 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-left: 6px;
        }
        .post-item .left .meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            transition: color 0.5s ease;
        }
        .post-item .right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .post-item .right .btn-icon {
            background: none;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .post-item .right .btn-icon:hover {
            background: var(--bg-body);
            color: var(--danger);
        }
        .post-item .right .btn-icon.pin-active {
            color: var(--warning);
        }
        .post-item .right .btn-icon.pin-active:hover {
            color: var(--warning);
            background: rgba(245, 158, 11, 0.1);
        }
        .post-item .right .btn-icon:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .post-item .right .view-link {
            background: none;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .post-item .right .view-link:hover {
            background: var(--bg-body);
            color: var(--text-primary);
        }

        /* ===== 状态 ===== */
        .empty-state,
        .loading-state,
        .error-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.5s ease;
        }
        .loading-state .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .error-state {
            color: var(--danger);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 1000;
            box-shadow: var(--shadow-hover);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            border-color: var(--danger);
            color: var(--danger);
        }
        .toast.success {
            border-color: var(--success);
            color: var(--success);
        }

        /* ===== Token 模态框 ===== */
        .token-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .token-modal.active {
            display: flex;
        }
        .token-modal .modal-box {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow-hover);
            border: 1px solid var(--border-color);
            transition: all 0.5s ease;
        }
        .token-modal .modal-box .title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            transition: color 0.5s ease;
        }
        .token-modal .modal-box .desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            transition: color 0.5s ease;
        }
        .token-modal .modal-box input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
            background: var(--bg-body);
            color: var(--text-primary);
            transition: all var(--transition-base);
            font-family: inherit;
        }
        .token-modal .modal-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .token-modal .modal-box .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            transition: color 0.5s ease;
        }
        .token-modal .modal-box .actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: flex-end;
        }

        /* ================================================================
           响应式
        ================================================================ */
        @media (max-width: 600px) {
            body {
                padding: 12px 10px 40px;
            }
            .nav-bar {
                padding: 8px 0 12px;
            }
            .nav-left .logo {
                font-size: 18px;
            }
            .nav-left .badge {
                font-size: 10px;
                padding: 1px 10px;
            }
            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .action-left .btn {
                flex: 1;
                justify-content: center;
            }
            .action-right {
                text-align: center;
            }
            .post-item {
                padding: 14px;
                flex-wrap: wrap;
            }
            .post-item .right {
                margin-left: 0;
                margin-top: 8px;
                width: 100%;
                justify-content: flex-end;
            }
            .theme-toggle .theme-label {
                display: none;
            }
            .token-status-bar .token-label-text {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .post-item .left .title {
                font-size: 14px;
            }
            .btn {
                font-size: 12px;
                padding: 8px 14px;
            }
            .btn-sm {
                font-size: 11px;
                padding: 4px 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 光晕背景 ===== -->
    <div class="bg-glow"></div>

    <!-- ===== 容器 ===== -->
    <div class="container">

        <!-- ===== 顶部导航 ===== -->
        <nav class="nav-bar">
            <div class="nav-left">
                <span class="logo">📂 <span>文章管理</span></span>
                <span class="badge" id="postCount">0 篇</span>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle" title="切换主题">
                    <span id="themeIcon">🌙</span>
                    <span class="theme-label" id="themeLabel">深色</span>
                </button>
                <button class="token-status-bar" id="tokenStatusBar" title="点击管理 Token">
                    <span class="dot inactive" id="tokenDot"></span>
                    <span class="token-label-text" id="tokenLabel">未配置</span>
                    <span>▾</span>
                </button>
            </div>
        </nav>

        <!-- ===== 操作栏 ===== -->
        <div class="action-bar">
            <div class="action-left">
                <a href="write.html" class="btn btn-primary">✍️ 写新文章</a>
                <button class="btn btn-outline btn-sm" onclick="loadPosts()">🔄 刷新</button>
                <button class="btn btn-outline btn-sm" onclick="rebuildIndex()">📇 重建索引</button>
            </div>
            <span class="action-right" id="lastUpdateTime"></span>
        </div>

        <!-- ===== 文章列表 ===== -->
        <div id="postList" class="post-list">
            <div class="loading-state">
                <div class="spinner"></div>
                <div>加载中...</div>
            </div>
        </div>

    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== Token 模态框 ===== -->
    <div class="token-modal" id="tokenModal">
        <div class="modal-box">
            <div class="title">🔑 GitHub Token</div>
            <div class="desc">用于删除文章、修改文章和置顶操作，Token 仅保存在你的浏览器中。</div>
            <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
            <div class="hint" id="tokenHint">输入后自动保存</div>
            <div class="actions">
                <button class="btn btn-outline btn-sm" onclick="clearToken()">清除</button>
                <button class="btn btn-primary btn-sm" onclick="saveTokenAndClose()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // 配置
        // ================================================================
        const REPO = 'xiaociwei01/CiweiBlog';
        const POSTS_PATH = 'posts';
        const API_URL = `https://api.github.com/repos/${REPO}/contents/${POSTS_PATH}`;
        const STORAGE_KEY = 'ciwei_blog_token';
        const THEME_KEY = 'ciwei_blog_theme';
        const DETAIL_PAGE = 'Xiangqingye.html';
        const EDIT_PAGE = 'write.html';

        let token = '';
        let postsData = [];

        // ================================================================
        // DOM 引用
        // ================================================================
        const $ = id => document.getElementById(id);
        const postList = $('postList');
        const toast = $('toast');
        const tokenModal = $('tokenModal');
        const tokenInput = $('tokenInput');
        const tokenHint = $('tokenHint');
        const tokenDot = $('tokenDot');
        const tokenLabel = $('tokenLabel');

        let toastTimer = null;

        // ================================================================
        // Toast
        // ================================================================
        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
            requestAnimationFrame(() => toast.classList.add('show'));
        }

        // ================================================================
        // 主题
        // ================================================================
        function getPreferredTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            if (saved === 'dark' || saved === 'light') return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            const icon = $('themeIcon');
            const label = $('themeLabel');
            if (theme === 'dark') {
                icon.textContent = '☀️';
                label.textContent = '浅色';
            } else {
                icon.textContent = '🌙';
                label.textContent = '深色';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        applyTheme(getPreferredTheme());
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem(THEME_KEY)) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });
        $('themeToggle').addEventListener('click', toggleTheme);

        // ================================================================
        // Token
        // ================================================================
        function loadToken() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved && saved.startsWith('ghp_')) {
                token = saved;
                tokenInput.value = saved;
                tokenDot.className = 'dot active';
                tokenLabel.textContent = '已配置';
                tokenHint.textContent = '✅ Token 已配置';
            } else {
                token = '';
                tokenDot.className = 'dot inactive';
                tokenLabel.textContent = '未配置';
                tokenHint.textContent = '⚠️ 请配置 Token 以删除/置顶/编辑文章';
            }
        }

        function saveTokenAndClose() {
            const val = tokenInput.value.trim();
            if (val && val.startsWith('ghp_')) {
                localStorage.setItem(STORAGE_KEY, val);
                token = val;
                tokenDot.className = 'dot active';
                tokenLabel.textContent = '已配置';
                tokenHint.textContent = '✅ Token 已配置';
                showToast('✅ Token 已保存');
                tokenModal.classList.remove('active');
                loadPosts();
            } else if (!val) {
                clearToken();
            } else {
                tokenHint.textContent = '⚠️ Token 格式错误，应以 ghp_ 开头';
                showToast('⚠️ Token 格式错误', 'error');
            }
        }

        function clearToken() {
            localStorage.removeItem(STORAGE_KEY);
            token = '';
            tokenInput.value = '';
            tokenDot.className = 'dot inactive';
            tokenLabel.textContent = '未配置';
            tokenHint.textContent = '⚠️ 请配置 Token 以删除/置顶/编辑文章';
            tokenModal.classList.remove('active');
            showToast('Token 已清除');
        }

        $('tokenStatusBar').addEventListener('click', () => {
            tokenModal.classList.add('active');
            tokenInput.focus();
        });
        tokenModal.addEventListener('click', e => {
            if (e.target === tokenModal) tokenModal.classList.remove('active');
        });
        tokenInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') saveTokenAndClose();
        });

        // ================================================================
        // 核心功能（原版逻辑，完全保留）
        // ================================================================
        function parseFrontmatter(contentText) {
            const result = { title: '', date: '', tags: '', pinned: false, modified: '' };
            const lines = contentText.split('\n');
            if (lines[0] === '---') {
                const end = lines.indexOf('---', 1);
                if (end !== -1) {
                    lines.slice(1, end).forEach(line => {
                        if (line.startsWith('title:')) result.title = line.replace('title:', '').trim();
                        if (line.startsWith('date:')) result.date = line.replace('date:', '').trim();
                        if (line.startsWith('tags:')) result.tags = line.replace('tags:', '').trim();
                        if (line.startsWith('pinned:')) result.pinned = line.replace('pinned:', '').trim() === 'true';
                        if (line.startsWith('modified:')) result.modified = line.replace('modified:', '').trim();
                    });
                    result.bodyStart = end + 1;
                    result.body = lines.slice(end + 1).join('\n').trim();
                }
            }
            return result;
        }

        async function fetchPosts() {
            const headers = token ? { 'Authorization': `token ${token}` } : {};
            const res = await fetch(API_URL, { headers });
            if (!res.ok) throw new Error(`API 请求失败 (状态码 ${res.status})`);
            const files = await res.json();
            const posts = files.filter(f => f.name.endsWith('.md'));

            const tasks = posts.map(async (post) => {
                try {
                    const contentRes = await fetch(post.download_url);
                    if (!contentRes.ok) return null;
                    const contentText = await contentRes.text();
                    const meta = parseFrontmatter(contentText);
                    return {
                        filename: post.name,
                        sha: post.sha,
                        contentText: contentText,
                        title: meta.title || post.name.replace('.md', ''),
                        date: meta.date || '未知日期',
                        tags: meta.tags,
                        pinned: meta.pinned,
                        modified: meta.modified,
                        dateObj: meta.date !== '未知日期' ? new Date(meta.date) : null
                    };
                } catch { return null; }
            });
            const results = await Promise.all(tasks);
            return results.filter(p => p !== null);
        }

        function renderPosts(posts) {
            postsData = posts;
            $('postCount').textContent = posts.length + ' 篇';
            $('lastUpdateTime').textContent = '更新于 ' + new Date().toLocaleTimeString();

            const sorted = [...posts].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return b.filename.localeCompare(a.filename);
            });

            if (sorted.length === 0) {
                postList.innerHTML =
                    `<div class="empty-state"><div>📝 还没有文章，点「写新文章」开始创作</div></div>`;
                return;
            }

            let html = '';
            for (const post of sorted) {
                const detailUrl = `${DETAIL_PAGE}?file=${encodeURIComponent(post.filename)}`;
                const editUrl = `${EDIT_PAGE}?file=${encodeURIComponent(post.filename)}`;
                const pinClass = post.pinned ? 'pin-active' : '';
                const pinBadge = post.pinned ? '<span class="badge-pin">📌 置顶</span>' : '';
                const modifiedBadge = post.modified ? '<span class="badge-modified">✏️ 已修改</span>' : '';

                html += `
                        <div class="post-item ${post.pinned ? 'pinned' : ''}" data-filename="${post.filename}" data-sha="${post.sha}">
                            <div class="left" onclick="window.open('${detailUrl}', '_blank')">
                                <span class="title">${post.title} ${pinBadge}${modifiedBadge}</span>
                                <div class="meta"><span>${post.date}</span></div>
                            </div>
                            <div class="right">
                                <button class="btn-icon ${pinClass}" onclick="togglePin(this)" title="${post.pinned ? '取消置顶' : '置顶文章'}">📌</button>
                                <a href="${editUrl}" class="view-link" title="编辑">✏️</a>
                                <a href="${detailUrl}" target="_blank" class="view-link" title="查看">👁️</a>
                                <button class="btn-icon" onclick="deletePost(this)" title="删除">🗑️</button>
                            </div>
                        </div>
                    `;
            }
            postList.innerHTML = html;
        }

        async function loadPosts() {
            postList.innerHTML =
                `<div class="loading-state"><div class="spinner"></div><div>加载中...</div></div>`;
            try {
                const posts = await fetchPosts();
                renderPosts(posts);
            } catch (err) {
                postList.innerHTML =
                    `<div class="error-state"><div>⚠️ 加载失败：${err.message}</div><div style="margin-top:10px;"><button class="btn btn-outline btn-sm" onclick="loadPosts()">🔄 重试</button></div></div>`;
                showToast('❌ 加载失败', 'error');
            }
        }

        function updatePinnedInContent(contentText, pinned) {
            const lines = contentText.split('\n');
            let hasPinned = false;
            let inFrontmatter = false;
            for (let i = 0; i < lines.length; i++) {
                if (lines[i] === '---') {
                    if (!inFrontmatter) { inFrontmatter = true; continue; } else break;
                }
                if (inFrontmatter && lines[i].startsWith('pinned:')) {
                    lines[i] = `pinned: ${pinned}`;
                    hasPinned = true;
                    break;
                }
            }
            if (!hasPinned) {
                let insertIndex = -1;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('date:') || lines[i].startsWith('tags:')) insertIndex = i;
                }
                if (insertIndex !== -1) lines.splice(insertIndex + 1, 0, `pinned: ${pinned}`);
                else lines.splice(1, 0, `pinned: ${pinned}`);
            }
            return lines.join('\n');
        }

        async function togglePin(btn) {
            const item = btn.closest('.post-item');
            const filename = item.dataset.filename;
            const sha = item.dataset.sha;
            if (!token) {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved && saved.startsWith('ghp_')) { token = saved; } else {
                    showToast('⚠️ 请先配置 Token', 'error');
                    tokenModal.classList.add('active');
                    return;
                }
            }
            const post = postsData.find(p => p.filename === filename);
            if (!post) return;
            const newPinned = !post.pinned;
            btn.disabled = true;
            try {
                const newContent = updatePinnedInContent(post.contentText, newPinned);
                const url = `https://api.github.com/repos/${REPO}/contents/${POSTS_PATH}/${filename}`;
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `${newPinned ? '置顶' : '取消置顶'}文章: ${filename}`,
                        content: btoa(unescape(encodeURIComponent(newContent))),
                        sha: sha,
                        branch: 'main'
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    post.pinned = newPinned;
                    post.sha = data.content.sha;
                    post.contentText = newContent;
                    renderPosts(postsData);
                    await rebuildIndex();
                    showToast(newPinned ? '✅ 已置顶，索引已同步' : '✅ 已取消置顶，索引已同步');
                } else {
                    const err = await res.json();
                    showToast(`❌ 操作失败：${err.message}`, 'error');
                    btn.disabled = false;
                }
            } catch (err) {
                showToast(`❌ 网络错误：${err.message}`, 'error');
                btn.disabled = false;
            }
        }

        function extractMediaPaths(markdown) {
            const paths = [];
            const imgRegex = /!\[.*?\]\((.*?)\)/g;
            let m;
            while ((m = imgRegex.exec(markdown)) !== null) {
                const path = extractRepoPath(m[1]);
                if (path) paths.push(path);
            }
            const vidRegex = /<video[^>]*src="([^"]*)"[^>]*>/g;
            while ((m = vidRegex.exec(markdown)) !== null) {
                const path = extractRepoPath(m[1]);
                if (path) paths.push(path);
            }
            return [...new Set(paths)];
        }

        function extractRepoPath(url) {
            if (url.includes('raw.githubusercontent.com/' + REPO + '/main/'))
                return url.split('raw.githubusercontent.com/' + REPO + '/main/')[1];
            if (url.includes('cdn.jsdelivr.net/gh/' + REPO + '@main/'))
                return url.split('cdn.jsdelivr.net/gh/' + REPO + '@main/')[1];
            if (url.includes('github.com/' + REPO + '/blob/main/'))
                return url.split('github.com/' + REPO + '/blob/main/')[1];
            return null;
        }

        async function deletePost(btn) {
            const item = btn.closest('.post-item');
            const filename = item.dataset.filename;
            const sha = item.dataset.sha;
            if (!token) {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved && saved.startsWith('ghp_')) token = saved;
                else {
                    showToast('⚠️ 请先配置 Token', 'error');
                    tokenModal.classList.add('active');
                    return;
                }
            }
            if (!confirm(`确定要删除「${filename}」吗？\n文章中的图片/视频也会一并删除！`)) return;
            btn.disabled = true;
            btn.textContent = '⏳';
            try {
                const post = postsData.find(p => p.filename === filename);
                let mediaPaths = [];
                if (post) mediaPaths = extractMediaPaths(post.contentText);
                const deleteUrl = `https://api.github.com/repos/${REPO}/contents/${POSTS_PATH}/${filename}`;
                const res = await fetch(deleteUrl, {
                    method: 'DELETE',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `删除文章: ${filename}`, sha: sha, branch: 'main' })
                });
                if (!res.ok) {
                    const err = await res.json();
                    showToast(`❌ 删除失败：${err.message}`, 'error');
                    btn.disabled = false;
                    btn.textContent = '🗑️';
                    return;
                }
                let deletedMedia = 0;
                for (const mediaPath of mediaPaths) {
                    try {
                        const mRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${mediaPath}`, {
                            headers: { 'Authorization': `token ${token}` }
                        });
                        if (mRes.ok) {
                            const mData = await mRes.json();
                            const dRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${mediaPath}`, {
                                method: 'DELETE',
                                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                                body: JSON.stringify({ message: `删除媒体: ${mediaPath}`, sha: mData.sha,
                                    branch: 'main' })
                            });
                            if (dRes.ok) deletedMedia++;
                        }
                    } catch {}
                }
                item.classList.add('deleting');
                setTimeout(async () => {
                    postsData = postsData.filter(p => p.filename !== filename);
                    renderPosts(postsData);
                    await rebuildIndex();
                    showToast(deletedMedia > 0 ? `✅ 已删除文章，清理了 ${deletedMedia} 个媒体文件` :
                        '✅ 已删除文章，索引已同步');
                }, 250);
            } catch (err) {
                showToast(`❌ 网络错误：${err.message}`, 'error');
                btn.disabled = false;
                btn.textContent = '🗑️';
            }
        }

        function buildMediaUrl(url) {
            if (!url) return '';
            if (url.includes('cdn.jsdelivr.net')) return url;
            if (url.includes('raw.githubusercontent.com/' + REPO + '/main/')) {
                const path = url.split('raw.githubusercontent.com/' + REPO + '/main/')[1];
                return `https://cdn.jsdelivr.net/gh/${REPO}@main/${path}`;
            }
            if (url.includes('github.com/' + REPO + '/blob/main/')) {
                const path = url.split('github.com/' + REPO + '/blob/main/')[1];
                return `https://cdn.jsdelivr.net/gh/${REPO}@main/${path}`;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://'))
                return `https://cdn.jsdelivr.net/gh/${REPO}@main/${url.replace(/^\.?\//, '')}`;
            return url;
        }

        function parsePostToIndexItem(contentText, filename) {
    const meta = parseFrontmatter(contentText);
    const images = [...meta.body.matchAll(/!\[.*?\]\((.*?)\)/g)].map(m => buildMediaUrl(m[1]));
    const videos = [...meta.body.matchAll(/<video[^>]*src="([^"]*)"[^>]*>/g)].map(m => buildMediaUrl(m[1]));
    let textBody = meta.body.replace(/!\[.*?\]\(.*?\)/g, '').replace(/<video[^>]*>.*?<\/video>/g, '').replace(/\n{3,}/g, '\n\n').trim();
    return {
        filename,
        title: meta.title || filename.replace('.md', ''),
        date: meta.date || '未知日期',
        tags: meta.tags.split(',').map(t => t.trim()).filter(t => t),
        body: textBody,
        images,
        videos,
        pinned: meta.pinned,      // 👈 加上这一行
        modified: meta.modified
    };
}

        async function rebuildIndex() {
            if (!token) {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved && saved.startsWith('ghp_')) token = saved;
                else {
                    showToast('⚠️ 请先配置 Token', 'error');
                    tokenModal.classList.add('active');
                    return;
                }
            }
            try {
                const indexPath = 'posts/index.json';
                const indexUrl = `https://api.github.com/repos/${REPO}/contents/${indexPath}`;
                let sha = '';
                try {
                    const getRes = await fetch(indexUrl, { headers: { 'Authorization': `token ${token}` } });
                    if (getRes.ok) { const data = await getRes.json();
                        sha = data.sha; }
                } catch (e) {}

                const postsRes = await fetch(API_URL, { headers: { 'Authorization': `token ${token}` } });
                if (!postsRes.ok) throw new Error('无法读取文章列表');
                const files = await postsRes.json();
                const mdFiles = files.filter(f => f.name.endsWith('.md'));
                const tasks = mdFiles.map(async post => {
                    try {
                        const contentRes = await fetch(post.download_url);
                        if (!contentRes.ok) return null;
                        const contentText = await contentRes.text();
                        return parsePostToIndexItem(contentText, post.name);
                    } catch { return null; }
                });
                const results = await Promise.all(tasks);
                const index = results.filter(p => p !== null);
                index.sort((a, b) => {
                    if (a.pinned && !b.pinned) return -1;
                    if (!a.pinned && b.pinned) return 1;
                    return (b.filename || '').localeCompare(a.filename || '');
                });
                const content = JSON.stringify(index, null, 2);
                const payload = {
                    message: `更新索引: ${new Date().toLocaleString()}`,
                    content: btoa(unescape(encodeURIComponent(content))),
                    branch: 'main'
                };
                if (sha) payload.sha = sha;
                const putRes = await fetch(indexUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (putRes.ok) showToast('✅ 索引已重建');
                else showToast('❌ 索引重建失败', 'error');
            } catch (err) {
                showToast(`❌ 索引重建失败：${err.message}`, 'error');
            }
        }

        // ================================================================
        // 启动
        // ================================================================
        loadToken();
        loadPosts();

        console.log('🦔 文章管理后台已启动（深色玻璃拟态版）');
        console.log('📦 仓库:', REPO);
    </script>
