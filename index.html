<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>刺猬的家</title>

    <!-- Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <!-- GSAP + ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>

    <style>
        /* ================================================================
               CSS 变量：浅色 / 深色模式
            ================================================================ */
        :root {
            /* 浅色模式 (默认) */
            --bg-body: #f0f2f5;
            --bg-hero: #e8ecf0;
            --text-primary: #1a1a2e;
            --text-secondary: #444;
            --text-muted: #888;
            --text-inverse: #fff;

            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.5);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --card-hover-shadow: 0 16px 48px rgba(0, 0, 0, 0.10);

            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.4);

            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.25);
            --pinned-tag-bg: rgba(0, 0, 0, 0.06);
            --pinned-tag-text: #888;

            --radius-md: 16px;
            --radius-lg: 24px;
            --transition-base: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);

            --max-width: 1024px;
            --font-family: 'Inter', -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
        }

        /* 深色模式 */
        [data-theme="dark"] {
            --bg-body: #0a0a0f;
            --bg-hero: #0d0d16;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.4);
            --text-inverse: #1a1a2e;

            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --card-hover-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);

            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);

            --pinned-tag-bg: rgba(255, 255, 255, 0.06);
            --pinned-tag-text: rgba(255, 255, 255, 0.4);
        }

        /* ================================================================
               全局重置
            ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                color 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ================================================================
               动态光晕背景
            ================================================================ */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }
        .bg-glow::before,
        .bg-glow::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            transition: all 2s ease;
        }
        .bg-glow::before {
            width: 600px;
            height: 600px;
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(88, 166, 255, 0.15) 0%, transparent 70%);
        }
        .bg-glow::after {
            width: 500px;
            height: 500px;
            bottom: -10%;
            right: -10%;
            background: radial-gradient(circle, rgba(255, 180, 60, 0.10) 0%, transparent 70%);
        }

        [data-theme="dark"] .bg-glow::before {
            background: radial-gradient(circle, rgba(88, 166, 255, 0.20) 0%, transparent 70%);
        }
        [data-theme="dark"] .bg-glow::after {
            background: radial-gradient(circle, rgba(255, 180, 60, 0.12) 0%, transparent 70%);
        }

        /* ================================================================
               容器
            ================================================================ */
        .container {
            position: relative;
            z-index: 1;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px 60px;
        }

        /* ================================================================
               顶部导航
            ================================================================ */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 20px 0 16px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 32px;
            transition: border-color 0.5s ease;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }
        .header-left .logo span {
            color: var(--accent);
        }

        .header-left .tagline {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
            transition: color 0.5s ease;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-right a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 30px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            transition: all var(--transition-base);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .header-right a:hover {
            background: var(--card-bg);
            border-color: var(--accent);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        /* 主题切换按钮 */
        .theme-toggle {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all var(--transition-base);
            font-family: inherit;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .theme-toggle:hover {
            background: var(--card-bg);
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .theme-toggle:active {
            transform: scale(0.93);
        }

        .theme-toggle .theme-label {
            font-size: 12px;
            font-weight: 500;
        }

        /* ================================================================
               Hero 区域
            ================================================================ */
        .hero {
            padding: 40px 0 48px;
            text-align: center;
            position: relative;
        }

        .hero-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--card-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            transition: all var(--transition-spring);
            cursor: pointer;
            background: var(--bg-body);
        }
        .hero-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
        }

        .hero-title {
            font-size: clamp(40px, 8vw, 80px);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.05;
            margin-top: 16px;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }
        .hero-title .highlight {
            background: linear-gradient(135deg, var(--accent), #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-sub {
            font-size: clamp(16px, 2vw, 22px);
            color: var(--text-secondary);
            margin-top: 8px;
            font-weight: 400;
            transition: color 0.5s ease;
        }

        .hero-signature {
            max-width: 640px;
            margin: 20px auto 0;
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-secondary);
            transition: color 0.5s ease;
        }
        .hero-signature img {
            max-width: 100%;
            max-height: 300px;
            border-radius: var(--radius-md);
            margin: 8px 0;
            display: block;
        }

        .hero-social {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
        }
        .hero-social a {
            padding: 8px 20px;
            border-radius: 40px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition-base);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .hero-social a:hover {
            background: var(--card-bg);
            border-color: var(--accent);
            color: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        /* ================================================================
               区块标题
            ================================================================ */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 48px 0 20px;
            transition: color 0.5s ease;
        }
        .section-title .count {
            font-weight: 400;
            opacity: 0.6;
        }

        /* ================================================================
               作品网格
            ================================================================ */
        .works-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 720px) {
            .works-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }
        }

        .work-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 24px 24px 22px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            transition: all var(--transition-spring);
            cursor: default;
            position: relative;
            overflow: hidden;
        }
        .work-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--card-hover-shadow);
            border-color: var(--accent);
        }
        .work-card:active {
            transform: scale(0.97);
            transition-duration: 0.08s;
        }

        .work-card .work-cover {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: var(--bg-body);
            margin-bottom: 14px;
            transition: transform var(--transition-base);
            cursor: pointer;
        }
        .work-card:hover .work-cover {
            transform: scale(1.02);
        }

        .work-card .work-name {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }

        .work-card .work-tags {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
            transition: color 0.5s ease;
        }

        .work-card .work-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-top: 8px;
            transition: color 0.5s ease;
        }

        .work-card .work-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
        }

        .work-card .work-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all var(--transition-base);
            font-family: inherit;
            background: var(--accent);
            color: #fff;
        }
        .work-card .work-link:hover {
            background: #4a8edb;
            box-shadow: 0 4px 20px var(--accent-glow);
            transform: translateY(-2px);
        }
        .work-card .work-link:active {
            transform: scale(0.93);
        }

        .work-card .platform-switcher {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--glass-bg);
            padding: 4px 12px 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            cursor: pointer;
            transition: all var(--transition-base);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            user-select: none;
            font-family: inherit;
        }
        .work-card .platform-switcher:hover {
            border-color: var(--accent);
            background: var(--card-bg);
            transform: translateY(-1px);
        }
        .work-card .platform-switcher:active {
            transform: scale(0.92);
        }
        .work-card .platform-switcher .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .work-card .platform-switcher .dot.netlify {
            background: #00ad9f;
        }
        .work-card .platform-switcher .dot.github {
            background: #6e5494;
        }
        .work-card .platform-switcher .label {
            font-weight: 500;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .work-card .fallback-link {
            font-size: 11px;
            color: var(--text-muted);
            text-decoration: none;
            border-bottom: 1px dotted var(--text-muted);
            transition: all var(--transition-base);
            cursor: pointer;
        }
        .work-card .fallback-link:hover {
            color: var(--text-secondary);
            border-color: var(--text-secondary);
        }

        /* ================================================================
               朋友圈板块
            ================================================================ */
        .friends-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 720px) {
            .friends-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }
        }

        .friend-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px 22px 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            transition: all var(--transition-spring);
            cursor: pointer;
        }
        .friend-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--card-hover-shadow);
            border-color: var(--accent);
        }
        .friend-card:active {
            transform: scale(0.97);
            transition-duration: 0.08s;
        }

        .friend-card .friend-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .friend-card .friend-header .friend-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-body);
            border: 1px solid var(--card-border);
            flex-shrink: 0;
        }
        .friend-card .friend-header .friend-meta {
            flex: 1;
            min-width: 0;
        }
        .friend-card .friend-header .friend-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }
        .friend-card .friend-header .friend-date {
            font-size: 12px;
            color: var(--text-muted);
            transition: color 0.5s ease;
        }

        .friend-card .friend-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            transition: color 0.5s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .friend-card .friend-title .pinned-tag {
            font-size: 11px;
            font-weight: 500;
            color: var(--pinned-tag-text);
            background: var(--pinned-tag-bg);
            padding: 1px 12px;
            border-radius: 12px;
            letter-spacing: 0.3px;
            transition: all 0.5s ease;
        }

        .friend-card .friend-content {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.5s ease;
        }
        .friend-card .friend-content img {
            max-width: 100%;
            border-radius: var(--radius-sm);
            margin: 4px 0;
        }

        .friend-card .friend-media {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-top: 10px;
        }
        .friend-card .friend-media.one {
            grid-template-columns: 1fr;
        }
        .friend-card .friend-media.two {
            grid-template-columns: 1fr 1fr;
        }
        .friend-card .friend-media img,
        .friend-card .friend-media video {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: var(--bg-body);
            cursor: pointer;
            transition: transform var(--transition-base);
        }
        .friend-card .friend-media img:hover,
        .friend-card .friend-media video:hover {
            transform: scale(1.02);
        }

        .friend-card .friend-more {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            transition: color 0.5s ease;
        }

        /* ================================================================
               空状态
            ================================================================ */
        .empty-state {
            text-align: center;
            padding: 32px 20px;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.5s ease;
        }
        .empty-state .empty-icon {
            font-size: 32px;
            margin-bottom: 6px;
        }
        .empty-state .empty-text {
            font-size: 14px;
        }

        /* ================================================================
               页脚
            ================================================================ */
        .footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            transition: all 0.5s ease;
            letter-spacing: 0.3px;
        }
        .footer .heart {
            color: #ef4444;
            display: inline-block;
            animation: heartbeat 1.8s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.2);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.15);
            }
            60% {
                transform: scale(1);
            }
        }

        /* ================================================================
               图片查看模态框
            ================================================================ */
        .img-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 20px;
        }
        .img-modal.active {
            display: flex;
        }
        .img-modal img {
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
            border-radius: var(--radius-sm);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: modalZoom 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes modalZoom {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .img-modal .close-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        /* ================================================================
               响应式调整
            ================================================================ */
        @media (max-width: 600px) {
            .container {
                padding: 0 16px 40px;
            }
            .header {
                padding: 14px 0 12px;
            }
            .header-left .logo {
                font-size: 19px;
            }
            .header-left .tagline {
                font-size: 12px;
            }
            .header-right a {
                font-size: 12px;
                padding: 4px 10px;
            }
            .theme-toggle {
                padding: 4px 10px;
                font-size: 12px;
            }
            .theme-toggle .theme-label {
                font-size: 11px;
            }
            .hero {
                padding: 20px 0 28px;
            }
            .hero-avatar {
                width: 72px;
                height: 72px;
            }
            .hero-signature {
                font-size: 14px;
                line-height: 1.7;
            }
            .section-title {
                font-size: 12px;
                margin: 32px 0 14px;
            }
            .work-card {
                padding: 16px 16px 18px;
            }
            .work-card .work-name {
                font-size: 17px;
            }
            .work-card .work-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .work-card .work-link {
                justify-content: center;
            }
            .work-card .platform-switcher {
                justify-content: center;
                padding: 6px 12px;
            }
            .friend-card {
                padding: 14px 16px 16px;
            }
            .friend-card .friend-title {
                font-size: 15px;
            }
            .friend-card .friend-media {
                grid-template-columns: repeat(3, 1fr);
            }
            .friend-card .friend-media.one {
                grid-template-columns: 1fr;
            }
            .friend-card .friend-media.two {
                grid-template-columns: 1fr 1fr;
            }
            .friends-grid {
                gap: 14px;
            }
            .works-grid {
                gap: 14px;
            }
        }

        @media (max-width: 400px) {
            .hero-title {
                font-size: 32px;
            }
            .hero-social a {
                font-size: 12px;
                padding: 6px 14px;
            }
            .work-card .work-desc {
                font-size: 13px;
            }
            .friend-card .friend-content {
                font-size: 13px;
            }
        }

        /* ================================================================
               GSAP 初始隐藏 (滚动入场)
            ================================================================ */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
        }
        .reveal-scale {
            opacity: 0;
            transform: scale(0.92) translateY(20px);
        }

        /* ================================================================
               减少动画偏好
            ================================================================ */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .reveal,
            .reveal-scale {
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 动态光晕背景 ===== -->
    <div class="bg-glow"></div>

    <!-- ================================================================ -->
    <!-- 容器 -->
    <!-- ================================================================ -->
    <div class="container">

        <!-- ===== 顶部导航 ===== -->
        <header class="header">
            <div class="header-left">
                <div class="logo">🦔 <span>刺猬</span>的家</div>
                <span class="tagline" id="headerTagline">独立开发者</span>
            </div>
            <div class="header-right">
                <a href="https://github.com/xiaociwei01" target="_blank" id="headerGithub">GitHub</a>
                <button class="theme-toggle" id="themeToggle" title="切换主题">
                    <span id="themeIcon">🌙</span>
                    <span class="theme-label" id="themeLabel">深色</span>
                </button>
            </div>
        </header>

        <!-- ===== Hero 区域 ===== -->
        <section class="hero">
            <img class="hero-avatar reveal" id="heroAvatar" src="" alt="头像" loading="lazy" />
            <h1 class="hero-title reveal">
                <span class="highlight" id="heroTitle">刺猬</span>
            </h1>
            <p class="hero-sub reveal" id="heroSub">独立开发者</p>
            <div class="hero-signature reveal" id="heroSignature">
                本站点使用 HTML+CSS+JavaScript 语言开发...
            </div>
            <div class="hero-social reveal">
                <a href="#" id="socialWechat">💬 微信</a>
                <a href="#" id="socialQQ">🐧 QQ</a>
            </div>
        </section>

        <!-- ===== 作品区 ===== -->
        <div class="section-title reveal">
            📦 作品 <span class="count" id="worksCount">(0)</span>
        </div>
        <div class="works-grid" id="worksGrid">
            <!-- 由 JS 动态渲染 -->
            <div class="empty-state">
                <div class="empty-icon">📭</div>
                <div class="empty-text">暂无作品</div>
            </div>
        </div>

        <!-- ===== 朋友圈区 ===== -->
        <div class="section-title reveal" style="margin-top:56px;">
            📝 朋友圈 <span class="count" id="friendsCount">(0)</span>
        </div>
        <div class="friends-grid" id="friendsGrid">
            <!-- 由 JS 动态渲染 -->
            <div class="empty-state">
                <div class="empty-icon">📭</div>
                <div class="empty-text">暂无动态</div>
            </div>
        </div>

        <!-- ===== 页脚 ===== -->
        <div class="footer reveal">
            <span class="heart">✦</span> 小刺猬 · 2026 <span class="heart">✦</span>
        </div>

    </div>

    <!-- ===== 图片查看模态框 ===== -->
    <div class="img-modal" id="imgModal" onclick="closeImgModal()">
        <img id="modalImg" src="" alt="查看大图" />
        <div class="close-hint">点击任意处关闭</div>
    </div>

    <script>
        // ================================================================
        // 配置
        // ================================================================
        const MANAGER_REPO = 'xiaociwei01/CiweiManager';
        const CONFIG_PATH = 'config.json';
        const THEME_KEY = 'ciwei_home_theme';

        // 默认头像 (CiweiHome 仓库里的)
        const DEFAULT_AVATAR = 'ciweitouxiang.jpg';

        // ================================================================
        // DOM 引用
        // ================================================================
        const $ = id => document.getElementById(id);

        // ================================================================
        // 工具函数
        // ================================================================
        function buildCdnUrl(path, sha = 'main') {
            if (!path) return '';
            if (path.startsWith('http://') || path.startsWith('https://')) return path;
            // 如果是默认头像，从 CiweiHome 仓库加载
            if (path === DEFAULT_AVATAR) {
                return `https://xiaociwei01.github.io/CiweiHome/${DEFAULT_AVATAR}`;
            }
            return `https://cdn.jsdelivr.net/gh/${MANAGER_REPO}@${sha}/${path}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '未知日期';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleString('zh-CN', { hour12: false });
            } catch {
                return dateStr;
            }
        }

        function renderMarkdown(text) {
            if (!text) return '';
            // 简单的 Markdown 渲染：图片、加粗、换行
            let html = text
                .replace(/!\[.*?\]\((.*?)\)/g, (match, url) => {
                    const fullUrl = url.startsWith('http') ? url : buildCdnUrl(url);
                    return `<img src="${fullUrl}" alt="图片" loading="lazy" />`;
                })
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br />');
            return html;
        }

        // ================================================================
        // 主题切换
        // ================================================================
        function getPreferredTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            if (saved === 'dark' || saved === 'light') return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            const icon = $('themeIcon');
            const label = $('themeLabel');
            if (theme === 'dark') {
                icon.textContent = '☀️';
                label.textContent = '浅色';
            } else {
                icon.textContent = '🌙';
                label.textContent = '深色';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        // 初始化主题
        applyTheme(getPreferredTheme());

        // 监听系统主题变化
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem(THEME_KEY)) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });

        $('themeToggle').addEventListener('click', toggleTheme);

        // ================================================================
        // 加载配置数据
        // ================================================================
        let configData = null;
        let linkConfig = {};

        async function loadConfig() {
            try {
                // 优先从 jsDelivr 加载
                const cdnUrl =
                    `https://cdn.jsdelivr.net/gh/${MANAGER_REPO}@main/${CONFIG_PATH}?t=${Date.now()}`;
                let res = await fetch(cdnUrl, { cache: 'no-store' });
                if (!res.ok) {
                    // 回退 raw
                    const rawUrl =
                    `https://raw.githubusercontent.com/${MANAGER_REPO}/main/${CONFIG_PATH}?t=${Date.now()}`;
                    res = await fetch(rawUrl, { cache: 'no-store' });
                    if (!res.ok) throw new Error('加载配置失败');
                }
                configData = await res.json();
                console.log('✅ 配置加载成功', configData);
                renderAll();
                // 启动 GSAP 入场动画
                initGSAP();
            } catch (err) {
                console.warn('加载配置失败，使用默认数据', err);
                // 使用默认数据（让页面不至于空白）
                configData = {
                    site: {
                        title: '刺猬',
                        subtitle: '独立开发者',
                        avatar: DEFAULT_AVATAR,
                        signature: '本站点使用 HTML+CSS+JavaScript 语言开发，评论系统由 Cusdis 实现。',
                        wechat: 'As08_0831',
                        qq: '2586279833'
                    },
                    works: [],
                    friends: []
                };
                renderAll();
                initGSAP();
            }
        }

        // ================================================================
        // 渲染函数
        // ================================================================
        function renderAll() {
            if (!configData) return;
            renderSite();
            renderWorks();
            renderFriends();
            updateCounts();
            // 初始化平台切换器状态
            initPlatformSwitchers();
        }

        // ----- 网站信息 -----
        function renderSite() {
            const site = configData.site || {};

            // 标题
            $('heroTitle').textContent = site.title || '刺猬';
            $('headerTagline').textContent = site.subtitle || '独立开发者';
            $('heroSub').textContent = site.subtitle || '独立开发者';

            // 头像
            const avatarPath = site.avatar || DEFAULT_AVATAR;
            $('heroAvatar').src = buildCdnUrl(avatarPath);
            $('heroAvatar').alt = site.title + '的头像';

            // 签名 (支持 Markdown)
            if (site.signature) {
                $('heroSignature').innerHTML = renderMarkdown(site.signature);
            } else {
                $('heroSignature').textContent = '本站点使用 HTML+CSS+JavaScript 语言开发。';
            }

            // 社交
            const wechat = site.wechat || 'As08_0831';
            const qq = site.qq || '2586279833';
            $('socialWechat').textContent = '💬 微信 ' + wechat;
            $('socialWechat').href = '#';
            $('socialWechat').onclick = (e) => {
                e.preventDefault();
                alert('微信: ' + wechat);
            };
            $('socialQQ').textContent = '🐧 QQ ' + qq;
            $('socialQQ').href = '#';
            $('socialQQ').onclick = (e) => {
                e.preventDefault();
                alert('QQ: ' + qq);
            };

            // GitHub 链接保持不变
        }

        // ----- 作品 -----
        function renderWorks() {
            const container = $('worksGrid');
            const works = (configData.works || []).filter(w => w.enabled !== false);

            if (works.length === 0) {
                container.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <div class="empty-icon">📭</div>
                            <div class="empty-text">暂无作品</div>
                        </div>
                    `;
                return;
            }

            let html = '';
            works.forEach((work, index) => {
                const coverUrl = work.cover ? buildCdnUrl(work.cover) : '';
                const primaryLink = work.primaryLink || '';
                const fallbackLink = work.fallbackLink || '#';
                const workId = work.id || 'work-' + index;

                // 存储链接配置供 JS 使用
                linkConfig[workId] = {
                    primary: primaryLink,
                    fallback: fallbackLink,
                    selected: 'primary'
                };

                html += `
                        <div class="work-card reveal" data-work-id="${workId}">
                            ${coverUrl ? `<img class="work-cover" src="${coverUrl}" alt="${work.name || '作品封面'}" loading="lazy" onclick="openImgModal(this.src)" />` : ''}
                            <div class="work-name">${work.name || '未命名作品'}</div>
                            ${work.tags ? `<div class="work-tags">${work.tags}</div>` : ''}
                            ${work.desc ? `<div class="work-desc">${work.desc}</div>` : ''}
                            <div class="work-actions">
                                <a class="work-link" id="work-link-${workId}" href="${primaryLink || fallbackLink}" target="_blank">
                                    🚀 进入
                                </a>
                                ${primaryLink || fallbackLink !== '#' ? `
                                    <button class="platform-switcher" data-work-id="${workId}" onclick="togglePlatform('${workId}')" title="点击切换平台">
                                        <span class="dot netlify" id="dot-${workId}"></span>
                                        <span class="label" id="label-${workId}">${primaryLink ? 'Netlify' : 'GitHub Pages'}</span>
                                        <span style="font-size:10px;color:var(--text-muted);">⇄</span>
                                    </button>
                                ` : ''}
                            </div>
                            ${primaryLink && fallbackLink && fallbackLink !== '#' ? `
                                <div style="margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text-muted);">
                                    <span>📡 <span id="primary-label-${workId}">主: ${primaryLink ? 'Netlify' : 'GitHub Pages'}</span></span>
                                    <a href="#" class="fallback-link" onclick="directNavigate('${workId}', 'fallback'); return false;">🔁 备用: ${primaryLink ? 'GitHub Pages' : 'Netlify'}</a>
                                </div>
                            ` : ''}
                        </div>
                    `;
            });

            container.innerHTML = html;
        }

        // ----- 朋友圈 -----
        function renderFriends() {
            const container = $('friendsGrid');
            const friends = configData.friends || [];

            if (friends.length === 0) {
                container.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <div class="empty-icon">📭</div>
                            <div class="empty-text">暂无动态</div>
                        </div>
                    `;
                return;
            }

            // 排序：置顶优先
            const sorted = [...friends].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return (b.id || '').localeCompare(a.id || '');
            });

            // 只显示最近 6 条（首页展示）
            const display = sorted.slice(0, 6);
            const hasMore = sorted.length > 6;

            let html = '';
            display.forEach((friend) => {
                const pinnedTag = friend.pinned ? '<span class="pinned-tag">🔝 置顶</span>' : '';
                const contentHtml = renderMarkdown(friend.content || '');

                // 媒体
                const allMedia = [...(friend.images || []), ...(friend.videos || [])];
                let mediaHtml = '';
                if (allMedia.length > 0) {
                    const count = allMedia.length;
                    let gridClass = 'one';
                    if (count === 2) gridClass = 'two';
                    else if (count >= 3) gridClass = '';

                    const items = allMedia.slice(0, 6).map(url => {
                        const fullUrl = buildCdnUrl(url);
                        const isVideo = url.match(/\.(mp4|mov|webm)$/i);
                        if (isVideo) {
                            return `<video src="${fullUrl}" muted playsinline loading="lazy"></video>`;
                        }
                        return `<img src="${fullUrl}" alt="媒体" loading="lazy" onclick="openImgModal(this.src)" />`;
                    }).join('');

                    mediaHtml = `<div class="friend-media ${gridClass}">${items}</div>`;
                    if (count > 6) {
                        mediaHtml +=
                            `<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">+${count - 6} 更多</div>`;
                    }
                }

                html += `
                        <div class="friend-card reveal" onclick="window.open('https://xiaociwei01.github.io/CiweiBlog/Xiangqingye.html?file=${encodeURIComponent(friend.id || '')}', '_blank')">
                            <div class="friend-header">
                                <img class="friend-avatar" src="${$('heroAvatar').src || DEFAULT_AVATAR}" alt="头像" />
                                <div class="friend-meta">
                                    <div class="friend-name">小刺猬</div>
                                    <div class="friend-date">${formatDate(friend.date)}</div>
                                </div>
                            </div>
                            <div class="friend-title">
                                ${friend.title || '无标题'} ${pinnedTag}
                            </div>
                            <div class="friend-content">${contentHtml}</div>
                            ${mediaHtml}
                        </div>
                    `;
            });

            if (hasMore) {
                html += `
                        <div class="empty-state" style="grid-column:1/-1;padding:20px;cursor:pointer;" onclick="window.open('FriendQuan.html', '_blank')">
                            <div style="font-size:14px;color:var(--text-secondary);">📖 查看全部 ${sorted.length} 条动态 →</div>
                        </div>
                    `;
            }

            container.innerHTML = html;
        }

        // ----- 计数 -----
        function updateCounts() {
            const works = (configData.works || []).filter(w => w.enabled !== false);
            const friends = configData.friends || [];
            $('worksCount').textContent = '(' + works.length + ')';
            $('friendsCount').textContent = '(' + friends.length + ')';
        }

        // ================================================================
        // 平台切换器逻辑
        // ================================================================
        function getCurrentLink(workId) {
            const cfg = linkConfig[workId];
            if (!cfg) return '#';
            return cfg.selected === 'primary' ? cfg.primary : cfg.fallback;
        }

        function getCurrentPlatform(workId) {
            const cfg = linkConfig[workId];
            if (!cfg) return 'Netlify';
            return cfg.selected === 'primary' ? 'Netlify' : 'GitHub Pages';
        }

        function updatePlatformUI(workId) {
            const cfg = linkConfig[workId];
            if (!cfg) return;

            const isPrimary = cfg.selected === 'primary';
            const dot = document.getElementById('dot-' + workId);
            const label = document.getElementById('label-' + workId);
            const primaryLabel = document.getElementById('primary-label-' + workId);
            const link = document.getElementById('work-link-' + workId);

            if (dot) {
                dot.className = 'dot ' + (isPrimary ? 'netlify' : 'github');
            }
            if (label) {
                label.textContent = isPrimary ? (cfg.primary ? 'Netlify' : 'GitHub Pages') : 'GitHub Pages';
            }
            if (primaryLabel) {
                primaryLabel.textContent = '主: ' + (isPrimary ? (cfg.primary ? 'Netlify' : 'GitHub Pages') : 'GitHub Pages');
            }
            if (link) {
                const url = isPrimary ? cfg.primary : cfg.fallback;
                link.href = url || '#';
                // 更新备用链接的 href
                const fallbackLinks = document.querySelectorAll(`.fallback-link[onclick*="${workId}"]`);
                fallbackLinks.forEach(el => {
                    const target = isPrimary ? cfg.fallback : cfg.primary;
                    el.href = target || '#';
                    el.textContent = '🔁 备用: ' + (isPrimary ? 'GitHub Pages' : 'Netlify');
                    el.onclick = function(e) {
                        e.preventDefault();
                        directNavigate(workId, 'fallback');
                    };
                });
            }

            // 更新平台切换器的 onclick 里的提示
            const switcher = document.querySelector(`.platform-switcher[data-work-id="${workId}"]`);
            if (switcher) {
                switcher.title = '当前: ' + getCurrentPlatform(workId);
            }
        }

        function togglePlatform(workId) {
            const cfg = linkConfig[workId];
            if (!cfg) return;
            if (!cfg.primary || !cfg.fallback || cfg.fallback === '#') {
                // 如果没有备用链接，不切换
                return;
            }
            cfg.selected = cfg.selected === 'primary' ? 'fallback' : 'primary';
            updatePlatformUI(workId);
        }

        function directNavigate(workId, target) {
            const cfg = linkConfig[workId];
            if (!cfg) return;
            const url = target === 'fallback' ? cfg.fallback : cfg.primary;
            if (url && url !== '#') {
                window.open(url, '_blank');
            }
        }

        function initPlatformSwitchers() {
            const workCards = document.querySelectorAll('.work-card');
            workCards.forEach(card => {
                const workId = card.dataset.workId;
                if (workId && linkConfig[workId]) {
                    updatePlatformUI(workId);
                }
            });
        }

        // ================================================================
        // 图片查看模态框
        // ================================================================
        function openImgModal(src) {
            if (!src) return;
            const modal = document.getElementById('imgModal');
            const img = document.getElementById('modalImg');
            img.src = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImgModal() {
            const modal = document.getElementById('imgModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeImgModal();
        });

        // ================================================================
        // GSAP 滚动入场动画
        // ================================================================
        function initGSAP() {
            // 检查 GSAP 是否加载完成
            if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
                // 如果还没加载，等待一下再试
                setTimeout(initGSAP, 500);
                return;
            }

            gsap.registerPlugin(ScrollTrigger);

            // 所有 .reveal 元素
            const reveals = document.querySelectorAll('.reveal');

            reveals.forEach((el, i) => {
                // 如果是空的占位状态，跳过
                if (el.querySelector('.empty-state')) return;

                gsap.fromTo(el, {
                        opacity: 0,
                        y: 40,
                        scale: 0.96,
                    }, {
                        opacity: 1,
                        y: 0,
                        scale: 1,
                        duration: 0.9,
                        ease: 'power4.out',
                        delay: i * 0.06,
                        scrollTrigger: {
                            trigger: el,
                            start: 'top 88%',
                            toggleActions: 'play none none none',
                        },
                    }
                );
            });

            // 作品卡片和朋友圈卡片单独处理 (延迟稍长)
            document.querySelectorAll('.work-card.reveal, .friend-card.reveal').forEach((el, i) => {
                gsap.fromTo(el, {
                        opacity: 0,
                        y: 50,
                        scale: 0.94,
                    }, {
                        opacity: 1,
                        y: 0,
                        scale: 1,
                        duration: 0.8,
                        ease: 'power4.out',
                        delay: i * 0.05 + 0.1,
                        scrollTrigger: {
                            trigger: el,
                            start: 'top 90%',
                            toggleActions: 'play none none none',
                        },
                    }
                );
            });

            // 头像特殊处理 (更柔和)
            const avatar = document.querySelector('.hero-avatar');
            if (avatar) {
                gsap.from(avatar, {
                    opacity: 0,
                    scale: 0.8,
                    duration: 1.0,
                    ease: 'power4.out',
                    delay: 0.2,
                });
            }

            console.log('🚀 GSAP 动画已启动');
        }

        // ================================================================
        // 启动
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
        });

        console.log('🦔 CiweiHome 已启动');
        console.log('📦 配置仓库:', MANAGER_REPO);
    </script>

</body>
</html>
