<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>开发者的小朋友圈</title>
    <style>
        /* ========== 基础重置 & 变量 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #1a1a2e;
            --primary-hover: #2d2d4a;
            --text: #1a1a2e;
            --text-muted: #555;
            --text-faint: #bbb;
            --bg-body: #f5f6fa;
            --bg-card: #ffffff;
            --border: #f0f0f0;
            --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition-fast: 0.15s ease;
            --transition-base: 0.25s ease;
            --transition-slow: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --grid-gap: 4px;
        }

        body {
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text);
            padding: 20px 16px 60px;
            max-width: 720px;
            margin: 0 auto;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== 顶部导航 ========== */
        .nav-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0 16px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 0.5s ease 0.05s forwards;
        }

        .nav-bar .back-link {
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #f0f0f0;
            transition: background var(--transition-base), transform var(--transition-fast);
            flex-shrink: 0;
        }

        .nav-bar .back-link:hover {
            background: #e0e0e0;
            transform: translateX(-2px);
        }

        .nav-bar .back-link:active {
            transform: scale(0.95);
        }

        .nav-bar .nav-title {
            font-size: 18px;
            font-weight: 700;
            flex: 1;
            text-align: center;
            color: var(--text);
        }

        .nav-bar .nav-title .sub {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-faint);
            display: block;
            margin-top: 2px;
        }

        /* ========== 动态列表 ========== */
        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .feed-item {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 16px 18px 18px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: box-shadow var(--transition-base), transform var(--transition-base), border-color var(--transition-base);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 0.4s ease forwards;
            animation-delay: calc(var(--index, 0) * 0.1s + 0.1s);
            -webkit-tap-highlight-color: transparent;
        }

        .feed-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: #e0e0e0;
        }

        .feed-item:active {
            transform: scale(0.99);
            transition-duration: 0.06s;
        }

        /* 卡片头部 */
        .feed-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            pointer-events: none; /* 让点击穿透到卡片，但头像区域不触发跳转？实际我们需要卡片点击，所以头部不阻止 */
        }

        .feed-header .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: #e0e5ed;
        }

        .feed-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .feed-header .info {
            flex: 1;
            min-width: 0;
        }

        .feed-header .info .name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .feed-header .info .time {
            font-size: 12px;
            color: var(--text-faint);
            margin-top: 1px;
        }

        /* 正文 */
        .feed-body {
            font-size: 15px;
            line-height: 1.7;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 10px;
            pointer-events: auto; /* 允许选择文字，但不影响卡片点击 */
            user-select: text;
        }

        .feed-body:empty {
            display: none;
        }

        /* ========== 图片九宫格（微信风格） ========== */
        .feed-images {
            display: grid;
            gap: var(--grid-gap);
            margin-top: 4px;
            pointer-events: auto; /* 图片区域拦截点击，触发图片放大 */
        }

        /* 单图：不裁剪，限制最大高度 */
        .feed-images.single {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .feed-images.single img {
            width: 100%;
            max-height: 420px;
            object-fit: contain;
            display: block;
            background: #f0f2f5;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: transform var(--transition-base);
        }

        .feed-images.single img:hover {
            transform: scale(1.01);
        }

        .feed-images.single img:active {
            transform: scale(0.98);
        }

        /* 多图：九宫格，每行 3 列，正方形裁剪 */
        .feed-images.multi {
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 1fr;
        }

        .feed-images.multi img {
            aspect-ratio: 1 / 1;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #f0f2f5;
            cursor: pointer;
            border-radius: 4px;
            transition: transform var(--transition-base);
        }

        .feed-images.multi img:hover {
            transform: scale(1.03);
        }

        .feed-images.multi img:active {
            transform: scale(0.97);
        }

        /* 当图片数量不是 3 的倍数时，让最后一行左对齐（grid 默认 stretching，但使用 auto-fit 或 repeat(3,1fr) 会占满，这里无需特殊处理） */
        /* 对于 2 张图片，微信是并排两张，但我们也用九宫格，每行3列，第二张后面空一格，可以接受 */
        /* 如果希望 2 张时并排且大小自适应，可以加下面规则 */
        .feed-images.multi.two {
            grid-template-columns: repeat(2, 1fr);
        }
        .feed-images.multi.two img {
            aspect-ratio: 1 / 1;
        }

        /* ========== 视频 ========== */
        .feed-videos {
            display: grid;
            gap: var(--grid-gap);
            margin-top: 4px;
            pointer-events: auto;
        }

        .feed-videos.single {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .feed-videos.single video {
            width: 100%;
            max-height: 420px;
            display: block;
            outline: none;
            border-radius: var(--radius-sm);
            background: #000;
        }

        .feed-videos.multi {
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 1fr;
        }

        .feed-videos.multi video {
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #000;
            outline: none;
            border-radius: 4px;
        }

        /* ========== 标签 ========== */
        .feed-tags {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            pointer-events: auto;
        }

        .feed-tags .tag {
            background: #f0f2f5;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #888;
        }

        /* ========== 空状态/加载状态 ========== */
        .empty-state, .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-faint);
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state .text { font-size: 16px; }

        .loading-state .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #eee;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== 图片预览模态框 ========== */
        .img-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 20px;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .img-modal.active { display: flex; }

        .img-modal img {
            max-width: 95%;
            max-height: 92%;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            animation: scaleIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .img-modal .close-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            letter-spacing: 0.5px;
            pointer-events: none;
            animation: fadeIn 0.5s ease 0.3s both;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            .feed-item { padding: 14px 14px 16px; }
            .feed-header .avatar { width: 38px; height: 38px; }
            .feed-body { font-size: 14px; }
            .feed-images.multi { gap: 3px; }
            .feed-videos.multi { gap: 3px; }
            .feed-images.single img { max-height: 280px; }
            .feed-videos.single video { max-height: 280px; }
            .nav-bar .nav-title { font-size: 16px; }
            .nav-bar .back-link { font-size: 13px; padding: 4px 10px; }
        }

        @media (min-width: 641px) {
            .feed-images.single img { max-height: 500px; }
            .feed-videos.single video { max-height: 500px; }
            .feed-images.multi { gap: 5px; }
            .feed-videos.multi { gap: 5px; }
        }

        @media (min-width: 768px) {
            body { padding: 24px 32px 60px; max-width: 820px; }
        }

        @media (min-width: 1024px) {
            body { max-width: 900px; padding: 32px 40px 60px; }
        }

        /* 减少动画偏好 */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <a class="back-link" href="index.html">← 返回</a>
        <div class="nav-title">
            🦔 开发者的小朋友圈
            <span class="sub">偶尔写写，记录一些瞬间</span>
        </div>
    </nav>

    <div id="feedList" class="feed-list">
        <div class="loading-state">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>
    </div>

    <div class="img-modal" id="imgModal" onclick="closeImgModal()">
        <img id="modalImg" src="" alt="查看大图">
        <div class="close-hint">点击任意处关闭</div>
    </div>

    <script>
        const BLOG_REPO = 'xiaociwei01/CiweiBlog';
        const BLOG_API = `https://api.github.com/repos/${BLOG_REPO}/contents/posts`;
        const AVATAR_URL = 'https://xiaociwei01.github.io/CiweiHome/ciweitouxiang.jpg';
        const NICKNAME = '小刺猬';
        const DETAIL_PAGE = 'https://xiaociwei01.github.io/CiweiBlog/Xiangqingye.html?file=xxx.md';

        function buildRawUrl(path) {
            if (path.startsWith('http://') || path.startsWith('https://')) {
                return path;
            }
            const clean = path.replace(/^\.?\//, '');
            return `https://raw.githubusercontent.com/${BLOG_REPO}/main/${clean}`;
        }

        // ========== 获取所有文章 ==========
        async function fetchAllPosts() {
            try {
                const res = await fetch(BLOG_API);
                if (!res.ok) throw new Error('无法读取文章列表');
                const files = await res.json();
                const posts = files.filter(f => f.name.endsWith('.md'));

                if (posts.length === 0) return [];

                posts.sort((a, b) => b.name.localeCompare(a.name));

                // 并发获取所有文章内容，提高加载速度
                const tasks = posts.map(async (post) => {
                    try {
                        const contentRes = await fetch(post.download_url);
                        const contentText = await contentRes.text();

                        const lines = contentText.split('\n');
                        let title = post.name.replace('.md', '');
                        let date = '未知日期';
                        let tags = '';
                        let bodyStart = 0;

                        if (lines[0] === '---') {
                            let end = lines.indexOf('---', 1);
                            if (end !== -1) {
                                const front = lines.slice(1, end);
                                front.forEach(line => {
                                    if (line.startsWith('title:')) title = line.replace('title:', '').trim();
                                    if (line.startsWith('date:')) date = line.replace('date:', '').trim();
                                    if (line.startsWith('tags:')) tags = line.replace('tags:', '').trim();
                                });
                                bodyStart = end + 1;
                            }
                        }

                        const body = lines.slice(bodyStart).join('\n').trim();

                        // 提取图片
                        const images = [];
                        const imgRegex = /!\[.*?\]\((.*?)\)/g;
                        let imgMatch;
                        while ((imgMatch = imgRegex.exec(body)) !== null) {
                            images.push(imgMatch[1]);
                        }

                        // 提取视频
                        const videos = [];
                        const vidRegex = /<video[^>]*src="([^"]*)"[^>]*>/g;
                        let vidMatch;
                        while ((vidMatch = vidRegex.exec(body)) !== null) {
                            videos.push(vidMatch[1]);
                        }

                        // 纯文本正文：去除图片和视频标签
                        let textBody = body;
                        textBody = textBody.replace(/!\[.*?\]\(.*?\)/g, '');
                        textBody = textBody.replace(/<video[^>]*>.*?<\/video>/g, '');
                        textBody = textBody.replace(/\n{3,}/g, '\n\n').trim();

                        return {
                            filename: post.name,
                            title: title,
                            date: date,
                            tags: tags.split(',').map(t => t.trim()).filter(t => t),
                            body: textBody,        // 完整正文
                            images: images,
                            videos: videos,
                            raw: body
                        };
                    } catch (e) {
                        console.warn('跳过文章:', post.name, e.message);
                        return null;
                    }
                });

                const results = await Promise.all(tasks);
                return results.filter(p => p !== null);
            } catch (err) {
                console.error('加载博客失败:', err);
                return null;
            }
        }

        // ========== 渲染图片 ==========
        function renderImages(images) {
            if (!images || images.length === 0) return '';

            const rawImages = images.map(img => buildRawUrl(img));

            if (images.length === 1) {
                return `
                    <div class="feed-images single">
                        <img src="${rawImages[0]}" alt="图片" onclick="openImgModal(event, this.src)" loading="lazy">
                    </div>
                `;
            }

            // 微信风格：2 张时并排，其他情况九宫格
            const twoClass = images.length === 2 ? 'two' : '';
            const imgsHtml = rawImages.map(src =>
                `<img src="${src}" alt="图片" onclick="openImgModal(event, this.src)" loading="lazy">`
            ).join('');

            return `
                <div class="feed-images multi ${twoClass}">
                    ${imgsHtml}
                </div>
            `;
        }

        // ========== 渲染视频 ==========
        function renderVideos(videos) {
            if (!videos || videos.length === 0) return '';

            const rawVideos = videos.map(v => buildRawUrl(v));

            if (videos.length === 1) {
                return `
                    <div class="feed-videos single">
                        <video controls src="${rawVideos[0]}" preload="metadata" onclick="event.stopPropagation();"></video>
                    </div>
                `;
            }

            const vidsHtml = rawVideos.map(src =>
                `<video controls src="${src}" preload="metadata" onclick="event.stopPropagation();"></video>`
            ).join('');

            return `
                <div class="feed-videos multi">
                    ${vidsHtml}
                </div>
            `;
        }

        // ========== 渲染动态列表 ==========
        function renderFeed(posts) {
            const container = document.getElementById('feedList');

            if (posts === null) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <div class="text">加载失败，请稍后重试</div>
                    </div>
                `;
                return;
            }

            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <div class="text">还没有文章，写一篇吧 ✍️</div>
                    </div>
                `;
                return;
            }

            let html = '';
            posts.forEach((post, index) => {
                const imagesHtml = renderImages(post.images);
                const videosHtml = renderVideos(post.videos);

                const tagsHtml = post.tags.length > 0 ?
                    `<div class="feed-tags">${post.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` :
                    '';

                html += `
                    <div class="feed-item" style="--index: ${index};" data-file="${post.filename}">
                        <div class="feed-header">
                            <div class="avatar">
                                <img src="${AVATAR_URL}" alt="头像" loading="lazy">
                            </div>
                            <div class="info">
                                <div class="name">${NICKNAME}</div>
                                <div class="time">${post.date}</div>
                            </div>
                        </div>
                        <div class="feed-body">${post.body}</div>
                        ${imagesHtml}
                        ${videosHtml}
                        ${tagsHtml}
                    </div>
                `;
            });

            container.innerHTML = html;

            // 给每个卡片绑定点击事件跳转详情页
            document.querySelectorAll('.feed-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    // 如果点击的是图片、视频或它们内部元素，不跳转
                    if (e.target.closest('.feed-images') || e.target.closest('.feed-videos')) {
                        return;
                    }
                    // 如果点击的是标签区域，也不跳转？可以跳转，但无妨
                    const filename = this.dataset.file;
                    if (filename) {
                        window.open(`${DETAIL_PAGE}?file=${encodeURIComponent(filename)}`, '_blank');
                    }
                });
            });
        }

        // ========== 图片放大 ==========
        function openImgModal(event, src) {
            event.stopPropagation(); // 阻止卡片跳转
            const modal = document.getElementById('imgModal');
            const img = document.getElementById('modalImg');
            img.src = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImgModal() {
            const modal = document.getElementById('imgModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeImgModal();
            }
        });

        // ========== 初始化 ==========
        async function init() {
            const posts = await fetchAllPosts();
            renderFeed(posts);
        }

        init();
    </script>

</body>
</html>
