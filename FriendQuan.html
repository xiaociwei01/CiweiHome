<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>开发者的小朋友圈</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: #f5f6fa;
            color: #1a1a2e;
            padding: 20px 16px 60px;
            max-width: 720px;
            margin: 0 auto;
        }

        /* ===== 顶部导航 ===== */
        .nav-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0 16px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }

        .nav-bar .back-link {
            color: #1a1a2e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #f0f0f0;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .nav-bar .back-link:hover {
            background: #e0e0e0;
        }

        .nav-bar .nav-title {
            font-size: 18px;
            font-weight: 700;
            flex: 1;
            text-align: center;
            color: #1a1a2e;
        }

        .nav-bar .nav-title .sub {
            font-size: 12px;
            font-weight: 400;
            color: #aaa;
            display: block;
            margin-top: 2px;
        }

        /* ===== 朋友圈动态列表 ===== */
        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ===== 单条动态（整体可点击） ===== */
        .feed-item-link {
            display: block;
            text-decoration: none;
            color: inherit;
            background: #ffffff;
            border-radius: 16px;
            padding: 16px 18px 18px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f0f0;
            transition: box-shadow 0.2s, transform 0.15s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .feed-item-link:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .feed-item-link:active {
            transform: scale(0.98);
            transition-duration: 0.06s;
        }

        /* ===== 单条动态内容 ===== */
        .feed-item {
            width: 100%;
        }

        /* 动态头部：头像 + 昵称 + 时间 */
        .feed-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .feed-header .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: #e0e5ed;
        }

        .feed-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .feed-header .info {
            flex: 1;
            min-width: 0;
        }

        .feed-header .info .name {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .feed-header .info .time {
            font-size: 12px;
            color: #bbb;
            margin-top: 1px;
        }

        /* 动态正文 */
        .feed-body {
            font-size: 15px;
            line-height: 1.7;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 10px;
        }

        .feed-body:empty {
            display: none;
        }

        /* ===== 图片网格 ===== */
        .feed-images {
            display: grid;
            gap: 4px;
            border-radius: 12px;
            overflow: hidden;
            background: #f5f6fa;
            margin-top: 4px;
        }

        .feed-images.single {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .feed-images.single img {
            width: 100%;
            max-height: 420px;
            object-fit: contain;
            display: block;
            background: #f0f2f5;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .feed-images.single img:hover {
            transform: scale(1.01);
        }

        .feed-images.multi {
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .feed-images.multi.three {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
        }

        .feed-images.multi.three img:first-child {
            grid-column: 1 / -1;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
        }

        .feed-images.multi.three img:nth-child(2),
        .feed-images.multi.three img:nth-child(3) {
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .feed-images.multi img {
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #f0f2f5;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 4px;
            width: 100%;
            height: 100%;
        }

        .feed-images.multi img:hover {
            transform: scale(1.02);
        }

        /* ===== 视频网格（和图片一样的逻辑） ===== */
        .feed-videos {
            display: grid;
            gap: 4px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            margin-top: 4px;
        }

        /* 单个视频 */
        .feed-videos.single {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .feed-videos.single video {
            width: 100%;
            max-height: 420px;
            display: block;
            outline: none;
            border-radius: 12px;
            background: #000;
        }

        /* 多个视频：2列网格 */
        .feed-videos.multi {
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        /* 3个视频时，第一个占一整行 */
        .feed-videos.multi.three {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
        }

        .feed-videos.multi.three video:first-child {
            grid-column: 1 / -1;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
        }

        .feed-videos.multi.three video:nth-child(2),
        .feed-videos.multi.three video:nth-child(3) {
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .feed-videos.multi video {
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #000;
            outline: none;
            border-radius: 4px;
            width: 100%;
            height: 100%;
        }

        /* ===== 图片+视频混合显示 ===== */
        .feed-media-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }

        .feed-media-group .media-label {
            font-size: 12px;
            color: #999;
            padding: 2px 0;
        }

        /* ===== 动态标签 ===== */
        .feed-tags {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .feed-tags .tag {
            background: #f0f2f5;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #888;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #bbb;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state .text {
            font-size: 16px;
        }

        /* ===== 加载状态 ===== */
        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #ccc;
            font-size: 14px;
        }

        .loading-state .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #eee;
            border-top: 3px solid #1a1a2e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== 图片查看模态框 ===== */
        .img-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 20px;
        }

        .img-modal.active {
            display: flex;
        }

        .img-modal img {
            max-width: 95%;
            max-height: 92%;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }

        .img-modal .close-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .feed-item-link {
                padding: 14px 14px 16px;
            }

            .feed-header .avatar {
                width: 38px;
                height: 38px;
            }

            .feed-body {
                font-size: 14px;
            }

            .feed-images.multi {
                gap: 3px;
            }

            .feed-images.single img {
                max-height: 280px;
            }

            .feed-videos.single video {
                max-height: 280px;
            }

            .feed-videos.multi {
                gap: 3px;
            }

            .nav-bar .nav-title {
                font-size: 16px;
            }

            .nav-bar .back-link {
                font-size: 13px;
                padding: 4px 10px;
            }
        }

        @media (min-width: 641px) {
            .feed-images.single img {
                max-height: 500px;
            }

            .feed-videos.single video {
                max-height: 500px;
            }

            .feed-images.multi {
                gap: 6px;
            }

            .feed-videos.multi {
                gap: 6px;
            }
        }

        @media (min-width: 768px) {
            body {
                padding: 24px 32px 60px;
                max-width: 820px;
            }
        }

        @media (min-width: 1024px) {
            body {
                max-width: 900px;
                padding: 32px 40px 60px;
            }
        }
    </style>
</head>
<body>

    <!-- ====== 顶部导航 ====== -->
    <nav class="nav-bar">
        <a class="back-link" href="https://xiaociwei01.github.io/CiweiHome/" target="_blank">← 返回</a>
        <div class="nav-title">
            🦔 开发者的小朋友圈
            <span class="sub">偶尔写写，记录一些瞬间</span>
        </div>
    </nav>

    <!-- ====== 动态列表 ====== -->
    <div id="feedList" class="feed-list">
        <div class="loading-state">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>
    </div>

    <!-- ====== 图片查看模态框 ====== -->
    <div class="img-modal" id="imgModal" onclick="closeImgModal()">
        <img id="modalImg" src="" alt="查看大图">
        <div class="close-hint">点击任意处关闭</div>
    </div>

    <script>
        // ================================================================
        // 配置
        // ================================================================
        const BLOG_REPO = 'xiaociwei01/CiweiBlog';
        const BLOG_API = `https://api.github.com/repos/${BLOG_REPO}/contents/posts`;
        const AVATAR_URL = 'https://xiaociwei01.github.io/CiweiHome/ciweitouxiang.jpg';
        const NICKNAME = '小刺猬';
        const DETAIL_PAGE = 'Xiangqingye.html'; // 详情页文件名

        // ================================================================
        // 工具函数：构建 raw 图片/视频地址
        // ================================================================
        function buildRawUrl(path) {
            if (path.startsWith('http://') || path.startsWith('https://')) {
                return path;
            }
            const clean = path.replace(/^\.?\//, '');
            return `https://raw.githubusercontent.com/${BLOG_REPO}/main/${clean}`;
        }

        // ================================================================
        // 获取所有博客文章
        // ================================================================
        async function fetchAllPosts() {
            try {
                const res = await fetch(BLOG_API);
                if (!res.ok) throw new Error('无法读取文章列表');
                const files = await res.json();
                const posts = files.filter(f => f.name.endsWith('.md'));

                if (posts.length === 0) {
                    return [];
                }

                posts.sort((a, b) => b.name.localeCompare(a.name));

                const postsWithContent = [];
                for (const post of posts) {
                    try {
                        const contentRes = await fetch(post.download_url);
                        const contentText = await contentRes.text();

                        const lines = contentText.split('\n');
                        let title = post.name.replace('.md', '');
                        let date = '未知日期';
                        let tags = '';
                        let bodyStart = 0;

                        if (lines[0] === '---') {
                            let end = lines.indexOf('---', 1);
                            if (end !== -1) {
                                const front = lines.slice(1, end);
                                front.forEach(line => {
                                    if (line.startsWith('title:')) title = line.replace('title:', '').trim();
                                    if (line.startsWith('date:')) date = line.replace('date:', '').trim();
                                    if (line.startsWith('tags:')) tags = line.replace('tags:', '').trim();
                                });
                                bodyStart = end + 1;
                            }
                        }

                        const body = lines.slice(bodyStart).join('\n').trim();

                        // 提取所有图片
                        const images = [];
                        const imgRegex = /!\[.*?\]\((.*?)\)/g;
                        let imgMatch;
                        while ((imgMatch = imgRegex.exec(body)) !== null) {
                            images.push(imgMatch[1]);
                        }

                        // 提取所有视频
                        const videos = [];
                        const vidRegex = /<video[^>]*src="([^"]*)"[^>]*>/g;
                        let vidMatch;
                        while ((vidMatch = vidRegex.exec(body)) !== null) {
                            videos.push(vidMatch[1]);
                        }

                        // 纯文本（去除图片和视频标记）
                        let textBody = body;
                        textBody = textBody.replace(/!\[.*?\]\(.*?\)/g, '');
                        textBody = textBody.replace(/<video[^>]*>.*?<\/video>/g, '');
                        textBody = textBody.replace(/\n{3,}/g, '\n\n').trim();

                        postsWithContent.push({
                            filename: post.name,
                            title: title,
                            date: date,
                            tags: tags.split(',').map(t => t.trim()).filter(t => t),
                            body: textBody,
                            images: images,
                            videos: videos,
                            raw: body
                        });
                    } catch (e) {
                        console.warn('跳过文章:', post.name, e.message);
                        continue;
                    }
                }

                return postsWithContent;
            } catch (err) {
                console.error('加载博客失败:', err);
                return null;
            }
        }

        // ================================================================
        // 渲染图片网格
        // ================================================================
        function renderImages(images) {
            if (!images || images.length === 0) return '';

            const rawImages = images.map(img => buildRawUrl(img));

            if (images.length === 1) {
                return `
                    <div class="feed-images single">
                        <img src="${rawImages[0]}" alt="图片" onclick="event.stopPropagation(); openImgModal(this.src)" loading="lazy">
                    </div>
                `;
            }

            const threeClass = images.length === 3 ? 'three' : '';
            const imgsHtml = rawImages.map(src =>
                `<img src="${src}" alt="图片" onclick="event.stopPropagation(); openImgModal(this.src)" loading="lazy">`
            ).join('');

            return `
                <div class="feed-images multi ${threeClass}">
                    ${imgsHtml}
                </div>
            `;
        }

        // ================================================================
        // 渲染视频网格（和图片一样的逻辑，支持多个视频）
        // ================================================================
        function renderVideos(videos) {
            if (!videos || videos.length === 0) return '';

            const rawVideos = videos.map(v => buildRawUrl(v));

            // 单个视频
            if (videos.length === 1) {
                return `
                    <div class="feed-videos single">
                        <video controls src="${rawVideos[0]}" preload="metadata"></video>
                    </div>
                `;
            }

            // 多个视频：2列网格
            const threeClass = videos.length === 3 ? 'three' : '';
            const vidsHtml = rawVideos.map(src =>
                `<video controls src="${src}" preload="metadata"></video>`
            ).join('');

            return `
                <div class="feed-videos multi ${threeClass}">
                    ${vidsHtml}
                </div>
            `;
        }

        // ================================================================
        // 渲染朋友圈
        // ================================================================
        function renderFeed(posts) {
            const container = document.getElementById('feedList');

            if (posts === null) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <div class="text">加载失败，请稍后重试</div>
                    </div>
                `;
                return;
            }

            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <div class="text">还没有文章，写一篇吧 ✍️</div>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const post of posts) {
                let displayText = post.body;
                if (displayText.length > 200) {
                    displayText = displayText.substring(0, 200) + '...';
                }

                const imagesHtml = renderImages(post.images);
                const videosHtml = renderVideos(post.videos);

                const tagsHtml = post.tags.length > 0 ?
                    `<div class="feed-tags">${post.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` :
                    '';

                const detailUrl = `${DETAIL_PAGE}?file=${encodeURIComponent(post.filename)}`;

                html += `
                    <a href="${detailUrl}" class="feed-item-link" target="_blank">
                        <div class="feed-item">
                            <div class="feed-header">
                                <div class="avatar">
                                    <img src="${AVATAR_URL}" alt="头像" loading="lazy">
                                </div>
                                <div class="info">
                                    <div class="name">${NICKNAME}</div>
                                    <div class="time">${post.date}</div>
                                </div>
                            </div>
                            ${displayText ? `<div class="feed-body">${displayText}</div>` : ''}
                            ${imagesHtml}
                            ${videosHtml}
                            ${tagsHtml}
                        </div>
                    </a>
                `;
            }

            container.innerHTML = html;
        }

        // ================================================================
        // 图片查看
        // ================================================================
        function openImgModal(src) {
            const modal = document.getElementById('imgModal');
            const img = document.getElementById('modalImg');
            img.src = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImgModal() {
            const modal = document.getElementById('imgModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeImgModal();
            }
        });

        // ================================================================
        // 启动
        // ================================================================
        async function init() {
            const posts = await fetchAllPosts();
            renderFeed(posts);
        }

        init();
    </script>

</body>
</html>
