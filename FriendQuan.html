<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>开发者的小朋友圈</title>
    <style>
        /* 样式与之前一致，但加入刷新按钮和状态提示 */
        :root {
            --primary: #1a1a2e;
            --text: #1a1a2e;
            --text-muted: #555;
            --text-faint: #bbb;
            --bg-body: #f5f6fa;
            --bg-card: #ffffff;
            --border: #f0f0f0;
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
            --radius-sm: 8px;
            --radius-lg: 16px;
            --grid-gap: 4px;
            --transition-base: 0.25s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text);
            padding: 20px 16px 60px;
            max-width: 720px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 16px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-bar .back-link {
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #f0f0f0;
            transition: background var(--transition-base);
        }
        .nav-bar .back-link:hover { background: #e0e0e0; }
        .nav-title { font-size: 18px; font-weight: 700; text-align: center; flex: 1; }
        .nav-title .sub { font-size: 12px; font-weight: 400; color: var(--text-faint); display: block; }
        .refresh-btn {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition-base);
            color: var(--text-muted);
        }
        .refresh-btn:hover { background: #f5f5f5; border-color: #ccc; }
        .refresh-btn:active { transform: scale(0.95); }
        .feed-list { display: flex; flex-direction: column; gap: 16px; }
        .feed-item {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: box-shadow var(--transition-base), transform var(--transition-base);
            cursor: pointer;
            opacity: 0;
            animation: fadeUp 0.4s ease forwards;
            animation-delay: calc(var(--index, 0) * 0.1s);
        }
        .feed-item:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .feed-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .feed-header .avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: #e0e5ed; flex-shrink: 0; }
        .feed-header .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .feed-header .info { flex: 1; min-width: 0; }
        .feed-header .info .name { font-size: 15px; font-weight: 600; }
        .feed-header .info .time { font-size: 12px; color: var(--text-faint); }
        .feed-body { font-size: 15px; line-height: 1.7; color: #333; white-space: pre-wrap; word-break: break-word; margin-bottom: 10px; }
        .feed-body:empty { display: none; }
        .feed-images { display: grid; gap: var(--grid-gap); margin-top: 6px; }
        .feed-images.single { grid-template-columns: 1fr; }
        .feed-images.single img { width: 100%; max-height: 400px; object-fit: contain; border-radius: var(--radius-sm); cursor: pointer; }
        .feed-images.multi { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; }
        .feed-images.multi.two { grid-template-columns: repeat(2, 1fr); }
        .feed-images.multi img { width: 100%; height: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; cursor: pointer; }
        .feed-videos { display: grid; gap: var(--grid-gap); margin-top: 6px; }
        .feed-videos.single { grid-template-columns: 1fr; }
        .feed-videos.single video { width: 100%; max-height: 400px; border-radius: var(--radius-sm); background: #000; }
        .feed-videos.multi { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; }
        .feed-videos.multi video { width: 100%; height: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; background: #000; }
        .feed-tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; }
        .feed-tags .tag { background: #f0f2f5; padding: 2px 10px; border-radius: 12px; font-size: 12px; color: #888; }
        .empty-state, .loading-state, .error-state {
            text-align: center; padding: 60px 20px; color: var(--text-faint); border-radius: var(--radius-lg);
            background: var(--bg-card); border: 1px solid var(--border);
        }
        .loading-state .spinner {
            display: inline-block; width: 24px; height: 24px;
            border: 3px solid #eee; border-top: 3px solid var(--primary);
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .img-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 9999; align-items: center; justify-content: center;
            cursor: pointer; padding: 20px;
        }
        .img-modal.active { display: flex; }
        .img-modal img { max-width: 95%; max-height: 92%; object-fit: contain; border-radius: 6px; }
        .img-modal .close-hint { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.3); font-size: 13px; }
        @media (max-width: 480px) {
            .feed-item { padding: 14px; }
            .nav-title { font-size: 16px; }
            .feed-images.multi { gap: 3px; }
            .feed-images.single img { max-height: 280px; }
            .feed-videos.single video { max-height: 280px; }
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <a class="back-link" href="index.html">← 返回</a>
        <div class="nav-title">
            🦔 开发者的小朋友圈
            <span class="sub">偶尔写写，记录一些瞬间</span>
        </div>
        <button class="refresh-btn" onclick="loadPosts(true)">🔄 刷新</button>
    </nav>

    <div id="feedList" class="feed-list">
        <div class="loading-state">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>
    </div>

    <div class="img-modal" id="imgModal" onclick="closeImgModal()">
        <img id="modalImg" src="" alt="查看大图">
        <div class="close-hint">点击任意处关闭</div>
    </div>

    <script>
        // ==================== 配置 ====================
        const REPO = 'xiaociwei01/CiweiBlog';
        const POSTS_PATH = 'posts';
        const API_URL = `https://api.github.com/repos/${REPO}/contents/${POSTS_PATH}`;
        const CDN_INDEX_URL = `https://cdn.jsdelivr.net/gh/${REPO}@main/${POSTS_PATH}/index.json`;
        const DETAIL_PAGE = 'https://xiaociwei01.github.io/CiweiBlog/Xiangqingye.html';
        const AVATAR_URL = 'https://xiaociwei01.github.io/CiweiHome/ciweitouxiang.jpg';
        const NICKNAME = '小刺猬';
        const CACHE_KEY = 'ciwei_blog_posts_cache'; // 与后台管理共用缓存
        const TOKEN_KEY = 'ciwei_blog_token';

        // ==================== 工具函数 ====================
        function getToken() {
            return localStorage.getItem(TOKEN_KEY) || '';
        }
        function loadCache() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch { return null; }
        }
        function saveCache(data) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(data));
            } catch (e) { console.warn('保存缓存失败', e); }
        }
        function buildRawUrl(path) {
            if (path.startsWith('http://') || path.startsWith('https://')) return path;
            const clean = path.replace(/^\.?\//, '');
            return `https://raw.githubusercontent.com/${REPO}/main/${clean}`;
        }

        // ==================== 渲染函数 ====================
        function renderImages(images) {
            if (!images || images.length === 0) return '';
            const rawImages = images.map(img => buildRawUrl(img));
            if (images.length === 1) {
                return `<div class="feed-images single"><img src="${rawImages[0]}" onclick="openImgModal(event, this.src)" loading="lazy"></div>`;
            }
            const twoClass = images.length === 2 ? 'two' : '';
            const imgsHtml = rawImages.map(src => `<img src="${src}" onclick="openImgModal(event, this.src)" loading="lazy">`).join('');
            return `<div class="feed-images multi ${twoClass}">${imgsHtml}</div>`;
        }
        function renderVideos(videos) {
            if (!videos || videos.length === 0) return '';
            const rawVideos = videos.map(v => buildRawUrl(v));
            if (videos.length === 1) {
                return `<div class="feed-videos single"><video controls src="${rawVideos[0]}" preload="metadata"></video></div>`;
            }
            const vidsHtml = rawVideos.map(src => `<video controls src="${src}" preload="metadata"></video>`).join('');
            return `<div class="feed-videos multi">${vidsHtml}</div>`;
        }
        function renderFeed(posts, isCache = false) {
            const container = document.getElementById('feedList');
            if (!posts || posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <div>还没有文章，写一篇吧 ✍️</div>
                    </div>
                `;
                return;
            }
            let html = '';
            posts.forEach((post, index) => {
                const imagesHtml = renderImages(post.images);
                const videosHtml = renderVideos(post.videos);
                const tagsHtml = post.tags && post.tags.length > 0 ?
                    `<div class="feed-tags">${post.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` : '';
                html += `
                    <div class="feed-item" style="--index: ${index};" data-file="${post.filename}">
                        <div class="feed-header">
                            <div class="avatar"><img src="${AVATAR_URL}" alt="头像" loading="lazy"></div>
                            <div class="info">
                                <div class="name">${NICKNAME}</div>
                                <div class="time">${post.date}</div>
                            </div>
                        </div>
                        <div class="feed-body">${post.body}</div>
                        ${imagesHtml}
                        ${videosHtml}
                        ${tagsHtml}
                    </div>
                `;
            });
            container.innerHTML = html;
            // 绑定卡片点击跳转
            document.querySelectorAll('.feed-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    if (e.target.closest('.feed-images') || e.target.closest('.feed-videos')) return;
                    const filename = this.dataset.file;
                    if (filename) window.open(`${DETAIL_PAGE}?file=${encodeURIComponent(filename)}`, '_blank');
                });
            });
            if (isCache) {
                // 显示缓存提示
                const hint = document.createElement('div');
                hint.style.textAlign = 'center';
                hint.style.fontSize = '12px';
                hint.style.color = '#aaa';
                hint.style.marginTop = '10px';
                hint.textContent = '⚠️ 当前为缓存数据，可能不是最新，点击右上角刷新';
                container.appendChild(hint);
            }
        }

        // ==================== 数据获取（多级回退） ====================
        async function fetchPostsFromAPI() {
            const token = getToken();
            const headers = token ? { 'Authorization': `token ${token}` } : {};
            const res = await fetch(API_URL, { headers });
            if (!res.ok) throw new Error('API 请求失败');
            const files = await res.json();
            const posts = files.filter(f => f.name.endsWith('.md'));
            // 并发获取每篇文章内容
            const tasks = posts.map(async (post) => {
                const contentRes = await fetch(post.download_url);
                if (!contentRes.ok) return null;
                const contentText = await contentRes.text();
                // 解析 frontmatter 和正文
                const lines = contentText.split('\n');
                let title = post.name.replace('.md', '');
                let date = '未知日期';
                let tags = '';
                let bodyStart = 0;
                if (lines[0] === '---') {
                    const end = lines.indexOf('---', 1);
                    if (end !== -1) {
                        lines.slice(1, end).forEach(line => {
                            if (line.startsWith('title:')) title = line.replace('title:', '').trim();
                            if (line.startsWith('date:')) date = line.replace('date:', '').trim();
                            if (line.startsWith('tags:')) tags = line.replace('tags:', '').trim();
                        });
                        bodyStart = end + 1;
                    }
                }
                const body = lines.slice(bodyStart).join('\n').trim();
                const images = [...body.matchAll(/!\[.*?\]\((.*?)\)/g)].map(m => m[1]);
                const videos = [...body.matchAll(/<video[^>]*src="([^"]*)"[^>]*>/g)].map(m => m[1]);
                let textBody = body.replace(/!\[.*?\]\(.*?\)/g, '').replace(/<video[^>]*>.*?<\/video>/g, '').replace(/\n{3,}/g, '\n\n').trim();
                return {
                    filename: post.name,
                    title,
                    date,
                    tags: tags.split(',').map(t => t.trim()).filter(t => t),
                    body: textBody,
                    images,
                    videos
                };
            });
            const results = await Promise.all(tasks);
            const validPosts = results.filter(p => p !== null);
            validPosts.sort((a, b) => b.filename.localeCompare(a.filename));
            return validPosts;
        }

        async function fetchPostsFromCDN() {
            const res = await fetch(CDN_INDEX_URL);
            if (!res.ok) throw new Error('CDN 索引不存在');
            const index = await res.json();
            if (!Array.isArray(index) || index.length === 0) return [];
            // 使用 CDN 索引中的元数据，但索引中应包含 body 或至少 filename，然后还需获取内容
            // 这里假设 index.json 中每个元素包含完整文章信息（由 write.html 维护）
            // 如果索引中没有 body，则尝试通过 raw 获取（但会慢）
            // 为简化，我们期望索引中有 body 和 images/videos 等完整信息
            // 如果索引结构不匹配，则返回空，触发其他回退
            if (!index[0].body && index[0].raw) {
                // 需要逐个获取内容
                const tasks = index.map(async (item) => {
                    const rawUrl = buildRawUrl(item.filename);
                    const res = await fetch(rawUrl);
                    if (!res.ok) return null;
                    const text = await res.text();
                    // 解析同 fetchPostsFromAPI
                    const lines = text.split('\n');
                    let title = item.filename.replace('.md', '');
                    let date = '未知日期';
                    let tags = '';
                    let bodyStart = 0;
                    if (lines[0] === '---') {
                        const end = lines.indexOf('---', 1);
                        if (end !== -1) {
                            lines.slice(1, end).forEach(line => {
                                if (line.startsWith('title:')) title = line.replace('title:', '').trim();
                                if (line.startsWith('date:')) date = line.replace('date:', '').trim();
                                if (line.startsWith('tags:')) tags = line.replace('tags:', '').trim();
                            });
                            bodyStart = end + 1;
                        }
                    }
                    const body = lines.slice(bodyStart).join('\n').trim();
                    // 简单提取图片和视频
                    const images = [...body.matchAll(/!\[.*?\]\((.*?)\)/g)].map(m => m[1]);
                    const videos = [...body.matchAll(/<video[^>]*src="([^"]*)"[^>]*>/g)].map(m => m[1]);
                    let textBody = body.replace(/!\[.*?\]\(.*?\)/g, '').replace(/<video[^>]*>.*?<\/video>/g, '').replace(/\n{3,}/g, '\n\n').trim();
                    return { filename: item.filename, title, date, tags: tags.split(',').map(t=>t.trim()).filter(t=>t), body: textBody, images, videos };
                });
                const results = await Promise.all(tasks);
                return results.filter(p => p !== null);
            } else {
                // 索引中已包含完整信息
                return index;
            }
        }

        async function loadPosts(forceRefresh = false) {
            const container = document.getElementById('feedList');
            // 先显示缓存（如果有且不是强制刷新）
            const cache = loadCache();
            if (cache && !forceRefresh) {
                renderFeed(cache, true);
                // 然后后台尝试更新
                try {
                    const freshPosts = await fetchPostsFromAPI();
                    if (freshPosts) {
                        saveCache(freshPosts);
                        renderFeed(freshPosts);
                    }
                } catch (e) {
                    console.warn('API 更新失败，使用缓存', e);
                    // 尝试 CDN
                    try {
                        const cdnPosts = await fetchPostsFromCDN();
                        if (cdnPosts && cdnPosts.length > 0) {
                            saveCache(cdnPosts);
                            renderFeed(cdnPosts);
                        }
                    } catch (e2) {
                        console.warn('CDN 回退也失败', e2);
                    }
                }
            } else {
                // 无缓存或强制刷新：显示加载动画
                container.innerHTML = `<div class="loading-state"><div class="spinner"></div><div>加载中...</div></div>`;
                let posts = null;
                try {
                    posts = await fetchPostsFromAPI();
                } catch (e) {
                    console.warn('API 失败，尝试 CDN', e);
                    try {
                        posts = await fetchPostsFromCDN();
                    } catch (e2) {
                        console.warn('CDN 失败', e2);
                    }
                }
                if (posts && posts.length > 0) {
                    saveCache(posts);
                    renderFeed(posts);
                } else {
                    // 全部失败，显示错误
                    container.innerHTML = `
                        <div class="error-state">
                            <div class="icon">⚠️</div>
                            <div>加载失败，请检查网络或稍后重试</div>
                            <div style="margin-top: 10px;"><button class="refresh-btn" onclick="loadPosts(true)">🔄 重新加载</button></div>
                        </div>
                    `;
                }
            }
        }

        // ==================== 图片预览 ====================
        function openImgModal(event, src) {
            event.stopPropagation();
            const modal = document.getElementById('imgModal');
            const img = document.getElementById('modalImg');
            img.src = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeImgModal() {
            document.getElementById('imgModal').classList.remove('active');
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeImgModal(); });

        // ==================== 初始化 ====================
        loadPosts(false);
    </script>
</body>
</html>
