<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>开发者的小朋友圈</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: rgba(255, 255, 255, 0.95);
            --text-primary: #1a1a2e;
            --text-secondary: #444;
            --text-muted: #888;
            --card-border: rgba(255, 255, 255, 0.5);
            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            --card-hover-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.4);
            --pinned-tag-bg: rgba(0, 0, 0, 0.06);
            --pinned-tag-text: #888;
            --accent: #58a6ff;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --transition-base: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --font-family: 'Inter', -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            --max-width: 720px;
        }

        [data-theme="dark"] {
            --bg-body: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-hover: rgba(255, 255, 255, 0.10);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.4);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            --card-hover-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --pinned-tag-bg: rgba(255, 255, 255, 0.06);
            --pinned-tag-text: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-body);
            color: var(--text-primary);
            padding: 20px 16px 60px;
            max-width: var(--max-width);
            margin: 0 auto;
            min-height: 100vh;
            transition: background 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                color 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            -webkit-font-smoothing: antialiased;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0 16px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 20px;
            transition: border-color 0.5s ease;
        }

        .nav-bar .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 30px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all var(--transition-base);
            flex-shrink: 0;
        }
        .nav-bar .back-link:hover {
            background: var(--bg-card);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .nav-bar .nav-title {
            font-size: 18px;
            font-weight: 700;
            flex: 1;
            text-align: center;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }
        .nav-bar .nav-title .sub {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
            display: block;
            margin-top: 2px;
            transition: color 0.5s ease;
        }

        .nav-bar .theme-toggle {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all var(--transition-base);
            font-family: inherit;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            flex-shrink: 0;
        }
        .nav-bar .theme-toggle:hover {
            background: var(--bg-card);
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .nav-bar .theme-toggle:active {
            transform: scale(0.93);
        }

        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .feed-item {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            transition: all var(--transition-spring);
            cursor: pointer;
            position: relative;
        }
        .feed-item:hover {
            box-shadow: var(--card-hover-shadow);
            transform: translateY(-2px);
            border-color: var(--accent);
        }
        .feed-item:active {
            transform: scale(0.97);
            transition-duration: 0.08s;
        }

        .feed-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .feed-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--bg-body);
            flex-shrink: 0;
            border: 1px solid var(--card-border);
        }
        .feed-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .feed-header .info {
            flex: 1;
            min-width: 0;
        }
        .feed-header .info .name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }
        .feed-header .info .time {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 1px;
            transition: color 0.5s ease;
        }

        .feed-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            transition: color 0.5s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .feed-title .pinned-tag {
            font-size: 11px;
            font-weight: 500;
            color: var(--pinned-tag-text);
            background: var(--pinned-tag-bg);
            padding: 1px 12px;
            border-radius: 12px;
            letter-spacing: 0.3px;
            transition: all 0.5s ease;
        }

        .feed-body {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-word;
            transition: color 0.5s ease;
        }
        .feed-body:empty {
            display: none;
        }
        .feed-body img {
            max-width: 100%;
            border-radius: var(--radius-sm);
            margin: 4px 0;
        }

        .feed-images {
            display: grid;
            gap: 4px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin-top: 8px;
        }
        .feed-images.single {
            grid-template-columns: 1fr;
            gap: 0;
        }
        .feed-images.single img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            display: block;
            background: var(--bg-body);
            border-radius: var(--radius-sm);
            cursor: pointer;
        }
        .feed-images.multi {
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 1fr;
        }
        .feed-images.multi.two {
            grid-template-columns: repeat(2, 1fr);
        }
        .feed-images.multi img {
            width: 100%;
            height: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
            background: var(--bg-body);
            cursor: pointer;
            border-radius: 4px;
        }

        .feed-videos {
            display: grid;
            gap: 4px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin-top: 8px;
            background: #000;
        }
        .feed-videos.single {
            grid-template-columns: 1fr;
            gap: 0;
        }
        .feed-videos.single video {
            width: 100%;
            max-height: 400px;
            display: block;
            border-radius: var(--radius-sm);
            background: #000;
        }
        .feed-videos.multi {
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 1fr;
        }
        .feed-videos.multi video {
            width: 100%;
            height: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
            background: #000;
            border-radius: 4px;
        }

        .feed-tags {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .feed-tags .tag {
            background: var(--glass-bg);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            transition: all 0.5s ease;
        }

        .badge-pin,
        .badge-modified {
            font-size: 12px;
            margin-left: 6px;
        }
        .badge-pin {
            color: var(--pinned-tag-text);
        }
        .badge-modified {
            color: var(--accent);
        }

        .empty-state,
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.5s ease;
        }
        .loading-state .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--card-border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 8px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .retry-btn {
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
            background: var(--glass-bg);
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all var(--transition-base);
            font-family: inherit;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .retry-btn:hover {
            background: var(--bg-card);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .img-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 20px;
        }
        .img-modal.active {
            display: flex;
        }
        .img-modal img {
            max-width: 95%;
            max-height: 92%;
            object-fit: contain;
            border-radius: var(--radius-sm);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: modalZoom 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes modalZoom {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .img-modal .close-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 12px 40px;
            }
            .feed-item {
                padding: 14px 16px;
            }
            .feed-header .avatar {
                width: 34px;
                height: 34px;
            }
            .feed-body {
                font-size: 14px;
            }
            .feed-title {
                font-size: 15px;
            }
            .feed-images.multi {
                gap: 3px;
            }
            .feed-images.single img {
                max-height: 280px;
            }
            .feed-videos.single video {
                max-height: 280px;
            }
            .nav-bar .nav-title {
                font-size: 16px;
            }
            .nav-bar .back-link {
                font-size: 13px;
                padding: 4px 10px;
            }
            .nav-bar .theme-toggle {
                padding: 4px 10px;
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <a class="back-link" href="index.html">← 返回</a>
        <div class="nav-title">
            🦔 开发者的小朋友圈
            <span class="sub">偶尔写写，记录一些瞬间</span>
        </div>
        <button class="theme-toggle" id="themeToggle" title="切换主题">
            <span id="themeIcon">🌙</span>
        </button>
    </nav>

    <div id="feedList" class="feed-list">
        <div class="loading-state">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>
    </div>

    <div class="img-modal" id="imgModal" onclick="closeImgModal()">
        <img id="modalImg" src="" alt="查看大图" />
        <div class="close-hint">点击任意处关闭</div>
    </div>

    <script>
        // ================================================================
        // 配置
        // ================================================================
        const MANAGER_REPO = 'xiaociwei01/CiweiManager';
        const CONFIG_PATH = 'config.json';
        const THEME_KEY = 'ciwei_friendquan_theme';
        const AVATAR_URL = 'https://xiaociwei01.github.io/CiweiHome/ciweitouxiang.jpg';
        const NICKNAME = '小刺猬';
        const DETAIL_PAGE = 'https://xiaociwei01.github.io/CiweiBlog/Xiangqingye.html';

        const $ = id => document.getElementById(id);

        // ================================================================
        // 工具函数
        // ================================================================
        function buildCdnUrl(path, sha = 'main') {
            if (!path) return '';
            if (path.startsWith('http://') || path.startsWith('https://')) return path;
            if (path === 'ciweitouxiang.jpg') {
                return AVATAR_URL;
            }
            return `https://cdn.jsdelivr.net/gh/${MANAGER_REPO}@${sha}/${path}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '未知日期';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                const pad = n => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            } catch {
                return dateStr;
            }
        }

        function renderMarkdown(text) {
            if (!text) return '';
            let html = text
                .replace(/!\[.*?\]\((.*?)\)/g, (match, url) => {
                    const fullUrl = url.startsWith('http') ? url : buildCdnUrl(url);
                    return `<img src="${fullUrl}" alt="图片" loading="lazy" />`;
                })
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br />');
            return html;
        }

        // ================================================================
        // 主题切换
        // ================================================================
        function getPreferredTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            if (saved === 'dark' || saved === 'light') return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            $('themeIcon').textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        applyTheme(getPreferredTheme());

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem(THEME_KEY)) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });

        $('themeToggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        // ================================================================
        // 加载数据
        // ================================================================
        async function loadPosts() {
            const container = $('feedList');
            container.innerHTML =
                `<div class="loading-state"><div class="spinner"></div><div>加载中...</div></div>`;

            try {
                const cdnUrl =
                    `https://cdn.jsdelivr.net/gh/${MANAGER_REPO}@main/${CONFIG_PATH}?t=${Date.now()}`;
                let res = await fetch(cdnUrl, { cache: 'no-store' });
                if (!res.ok) {
                    const rawUrl =
                        `https://raw.githubusercontent.com/${MANAGER_REPO}/main/${CONFIG_PATH}?t=${Date.now()}`;
                    res = await fetch(rawUrl, { cache: 'no-store' });
                    if (!res.ok) throw new Error('加载配置失败');
                }
                const data = await res.json();
                const friends = data.friends || [];

                if (friends.length === 0) {
                    container.innerHTML =
                        `<div class="empty-state"><div style="font-size:32px;margin-bottom:8px;">📭</div><div>还没有动态，写一篇吧 ✍️</div></div>`;
                    return;
                }

                renderFeed(friends);
            } catch (err) {
                console.warn('加载失败', err);
                container.innerHTML = `
                            <div class="empty-state">
                                <div style="font-size:32px;margin-bottom:8px;">⚠️</div>
                                <div>加载失败，请检查网络或稍后重试</div>
                                <div style="margin-top:14px;">
                                    <button class="retry-btn" onclick="loadPosts()">🔄 重试</button>
                                </div>
                            </div>
                        `;
            }
        }

        // ================================================================
        // 渲染朋友圈
        // ================================================================
        function renderFeed(friends) {
            const container = $('feedList');

            const sorted = [...friends].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return (b.id || '').localeCompare(a.id || '');
            });

            let html = '';
            sorted.forEach((post) => {
                const pinnedTag = post.pinned ? '<span class="pinned-tag">🔝 置顶</span>' : '';
                const contentHtml = renderMarkdown(post.content || '');

                const images = (post.images || []).map(url => buildCdnUrl(url));
                const videos = (post.videos || []).map(url => buildCdnUrl(url));

                let imagesHtml = '';
                if (images.length > 0) {
                    const cls = images.length === 1 ? 'single' : (images.length === 2 ? 'multi two' : 'multi');
                    const imgs = images.map(src =>
                        `<img src="${src}" alt="图片" onclick="openImgModal(event, this.src)" loading="lazy" />`
                    ).join('');
                    imagesHtml = `<div class="feed-images ${cls}">${imgs}</div>`;
                }

                let videosHtml = '';
                if (videos.length > 0) {
                    const cls = videos.length === 1 ? 'single' : 'multi';
                    const vids = videos.map(src =>
                        `<video controls src="${src}" preload="metadata" playsinline></video>`
                    ).join('');
                    videosHtml = `<div class="feed-videos ${cls}">${vids}</div>`;
                }

                const tagsHtml = post.tags && post.tags.length > 0 ?
                    `<div class="feed-tags">${post.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` :
                    '';

                const modifiedHtml = post.modified ?
                    `<span class="badge-modified">✏️ 已修改</span>` :
                    '';

                html += `
                            <div class="feed-item" data-file="${post.id || ''}">
                                <div class="feed-header">
                                    <div class="avatar"><img src="${AVATAR_URL}" alt="头像" loading="lazy" /></div>
                                    <div class="info">
                                        <div class="name">${NICKNAME}</div>
                                        <div class="time">${formatDate(post.date)}</div>
                                    </div>
                                </div>
                                <div class="feed-title">
                                    ${post.title || '无标题'} ${pinnedTag}
                                </div>
                                <div class="feed-body">${contentHtml}</div>
                                ${imagesHtml}
                                ${videosHtml}
                                ${tagsHtml}
                                <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
                                    ${post.pinned ? '<span class="badge-pin">📌 置顶</span>' : ''}
                                    ${modifiedHtml}
                                </div>
                            </div>
                        `;
            });

            container.innerHTML = html;

            // 点击卡片跳转详情
            document.querySelectorAll('.feed-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    if (e.target.closest('.feed-images') || e.target.closest('.feed-videos')) return;
                    const filename = this.dataset.file;
                    if (filename) {
                        window.open(`${DETAIL_PAGE}?file=${encodeURIComponent(filename)}`, '_blank');
                    }
                });
            });
        }

        // ================================================================
        // 图片查看
        // ================================================================
        function openImgModal(event, src) {
            event.stopPropagation();
            const modal = $('imgModal');
            const img = $('modalImg');
            img.src = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImgModal() {
            $('imgModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeImgModal();
        });

        // ================================================================
        // 启动
        // ================================================================
        document.addEventListener('DOMContentLoaded', loadPosts);

        console.log('🦔 FriendQuan 已启动 (改造版)');
        console.log('📦 配置仓库:', MANAGER_REPO);
    </script>

</body>
</html>
