<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>朋友圈 · 小刺猬</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: rgba(255, 255, 255, 0.95);
            --text-primary: #1a1a2e;
            --text-secondary: #444;
            --text-muted: #888;
            --border-color: rgba(0, 0, 0, 0.06);
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius-lg: 20px;
            --radius-md: 14px;
            --transition-base: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            --pinned-tag-bg: rgba(0, 0, 0, 0.06);
            --pinned-tag-text: #888;
            --accent: #58a6ff;
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        [data-theme="dark"] {
            --bg-body: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.4);
            --border-color: rgba(255, 255, 255, 0.06);
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.5);
            --glass-border: rgba(255, 255, 255, 0.06);
            --pinned-tag-bg: rgba(255, 255, 255, 0.06);
            --pinned-tag-text: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 16px 60px;
            transition: background 0.5s ease, color 0.5s ease;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
            transition: border-color 0.5s ease;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: all var(--transition-base);
        }
        .header-left .back-link:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }
        .header-left .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }
        .header-left .logo span {
            color: var(--accent);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all var(--transition-base);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .theme-toggle:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }
        .theme-toggle:active {
            transform: scale(0.93);
        }
        .theme-toggle .theme-label {
            font-size: 12px;
            font-weight: 500;
        }

        .count-badge {
            font-size: 13px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            transition: all 0.5s ease;
        }

        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .feed-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px 22px;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-card);
            transition: all var(--transition-spring);
            cursor: pointer;
        }
        .feed-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }
        .feed-item:active {
            transform: scale(0.98);
            transition-duration: 0.08s;
        }

        .feed-item .feed-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .feed-item .feed-header .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .feed-item .feed-header .meta {
            flex: 1;
            min-width: 0;
        }
        .feed-item .feed-header .meta .name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }
        .feed-item .feed-header .meta .date {
            font-size: 12px;
            color: var(--text-muted);
            transition: color 0.5s ease;
        }

        .feed-item .feed-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            transition: color 0.5s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .feed-item .feed-title .pinned-tag {
            font-size: 11px;
            font-weight: 500;
            color: var(--pinned-tag-text);
            background: var(--pinned-tag-bg);
            padding: 1px 12px;
            border-radius: 12px;
            letter-spacing: 0.3px;
            transition: all 0.5s ease;
        }

        .feed-item .feed-content {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-secondary);
            transition: color 0.5s ease;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .feed-item .feed-content img {
            max-width: 100%;
            border-radius: var(--radius-md);
            margin: 6px 0;
        }

        .feed-item .feed-media {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-top: 12px;
        }
        .feed-item .feed-media.one {
            grid-template-columns: 1fr;
        }
        .feed-item .feed-media.two {
            grid-template-columns: 1fr 1fr;
        }
        .feed-item .feed-media img,
        .feed-item .feed-media video {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: var(--bg-body);
            cursor: pointer;
            transition: transform var(--transition-base);
        }
        .feed-item .feed-media img:hover,
        .feed-item .feed-media video:hover {
            transform: scale(1.02);
        }

        .feed-item .feed-modified {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            transition: color 0.5s ease;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(12px);
            transition: all 0.5s ease;
        }
        .empty-state .empty-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .img-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(20px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 20px;
        }
        .img-modal.active {
            display: flex;
        }
        .img-modal img {
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
            border-radius: var(--radius-sm);
            animation: modalZoom 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes modalZoom {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .img-modal .close-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px 10px 40px;
            }
            .header {
                padding: 8px 0 12px;
            }
            .header-left .logo {
                font-size: 15px;
            }
            .header-left .back-link {
                font-size: 12px;
                padding: 4px 10px;
            }
            .theme-toggle {
                padding: 4px 10px;
                font-size: 12px;
            }
            .theme-toggle .theme-label {
                font-size: 10px;
            }
            .count-badge {
                font-size: 11px;
                padding: 3px 10px;
            }
            .feed-item {
                padding: 14px 16px;
            }
            .feed-item .feed-title {
                font-size: 15px;
            }
            .feed-item .feed-content {
                font-size: 14px;
            }
            .feed-item .feed-media {
                grid-template-columns: repeat(3, 1fr);
            }
            .feed-item .feed-media.one {
                grid-template-columns: 1fr;
            }
            .feed-item .feed-media.two {
                grid-template-columns: 1fr 1fr;
            }
            .feed-item .feed-header .avatar {
                width: 36px;
                height: 36px;
            }
        }
        @media (max-width: 400px) {
            .feed-item .feed-title {
                font-size: 14px;
            }
            .feed-item .feed-content {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <header class="header">
            <div class="header-left">
                <a class="back-link" href="index.html">← 返回</a>
                <div class="logo">🦔 <span>朋友圈</span></div>
            </div>
            <div class="header-right">
                <span class="count-badge" id="countBadge">0 条</span>
                <button class="theme-toggle" id="themeToggle">
                    <span id="themeIcon">🌙</span>
                    <span class="theme-label" id="themeLabel">深色</span>
                </button>
            </div>
        </header>

        <div class="feed-list" id="feedList">
            <div class="empty-state">
                <div class="empty-icon">📭</div>
                <div>加载中...</div>
            </div>
        </div>

    </div>

    <div class="img-modal" id="imgModal" onclick="closeImgModal()">
        <img id="modalImg" src="" alt="查看大图" />
        <div class="close-hint">点击任意处关闭</div>
    </div>

    <script>
        // ================================================================
        // 配置
        // ================================================================
        const MANAGER_REPO = 'xiaociwei01/CiweiManager';
        const CONFIG_PATH = 'config.json';
        const THEME_KEY = 'ciwei_home_theme';
        const DETAIL_PAGE = 'Xiangqingye.html';
        const DEFAULT_AVATAR = 'ciweitouxiang.jpg';

        const $ = id => document.getElementById(id);

        // ================================================================
        // 工具函数
        // ================================================================
        function buildCdnUrl(path) {
            if (!path) return '';
            if (path.startsWith('http://') || path.startsWith('https://')) return path;
            const localImages = ['ciweitouxiang.jpg', 'wechat_qr.jpg', 'qq_qr.jpg'];
            if (localImages.includes(path)) {
                return `https://xiaociwei01.github.io/CiweiHome/${path}`;
            }
            return `https://cdn.jsdelivr.net/gh/${MANAGER_REPO}@main/${path}`;
        }

        function formatDateToMinute(dateStr) {
            if (!dateStr) return '未知日期';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const h = String(d.getHours()).padStart(2, '0');
                const min = String(d.getMinutes()).padStart(2, '0');
                return `${y}-${m}-${day} ${h}:${min}`;
            } catch {
                return dateStr;
            }
        }

        function renderMarkdown(text) {
            if (!text) return '';
            let html = text
                .replace(/!\[.*?\]\((.*?)\)/g, (match, url) => {
                    const fullUrl = buildCdnUrl(url);
                    return `<img src="${fullUrl}" alt="图片" loading="lazy" onclick="openImgModal(this.src)" />`;
                })
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br />');
            return html;
        }

        // ================================================================
        // 主题
        // ================================================================
        function getPreferredTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            if (saved === 'dark' || saved === 'light') return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            const icon = $('themeIcon');
            const label = $('themeLabel');
            if (theme === 'dark') {
                icon.textContent = '☀️';
                label.textContent = '浅色';
            } else {
                icon.textContent = '🌙';
                label.textContent = '深色';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        applyTheme(getPreferredTheme());
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem(THEME_KEY)) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });
        $('themeToggle').addEventListener('click', toggleTheme);

        // ================================================================
        // 加载数据
        // ================================================================
        let configData = null;
        let configLoaded = false;

        async function loadConfig() {
            try {
                const t = Date.now();
                const cdnUrl =
                    `https://cdn.jsdelivr.net/gh/${MANAGER_REPO}@main/${CONFIG_PATH}?t=${t}`;
                let res = await fetch(cdnUrl, { cache: 'no-store' });
                if (!res.ok) {
                    const rawUrl =
                        `https://raw.githubusercontent.com/${MANAGER_REPO}/main/${CONFIG_PATH}?t=${t}`;
                    res = await fetch(rawUrl, { cache: 'no-store' });
                    if (!res.ok) throw new Error('加载失败');
                }
                configData = await res.json();
                configLoaded = true;
                renderFriends();
            } catch (err) {
                console.warn('加载失败', err);
                configData = null;
                configLoaded = false;
                $('feedList').innerHTML =
                    `<div class="empty-state"><div class="empty-icon">⚠️</div><div>加载失败，请稍后重试</div></div>`;
            }
        }

        function getSiteConfig() {
            if (configData && configData.site) {
                return configData.site;
            }
            return { title: '小刺猬', avatar: DEFAULT_AVATAR };
        }

        function getFriends() {
            if (configData && configData.friends && configData.friends.length > 0) {
                return configData.friends;
            }
            return [];
        }

        // ================================================================
        // 渲染
        // ================================================================
        function renderFriends() {
            const container = $('feedList');
            const friends = getFriends();
            const site = getSiteConfig();

            $('countBadge').textContent = friends.length + ' 条';

            if (friends.length === 0) {
                container.innerHTML =
                    `<div class="empty-state"><div class="empty-icon">📭</div><div>暂无动态</div></div>`;
                return;
            }

            const sorted = [...friends].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return (b.id || '').localeCompare(a.id || '');
            });

            const avatarUrl = buildCdnUrl(site.avatar || DEFAULT_AVATAR);
            const authorName = site.title || '小刺猬';

            let html = '';
            sorted.forEach((friend) => {
                const pinnedTag = friend.pinned ? '<span class="pinned-tag">🔝 置顶</span>' : '';
                const contentHtml = renderMarkdown(friend.content || '');
                const displayDate = formatDateToMinute(friend.date);

                const allMedia = [...(friend.images || []), ...(friend.videos || [])];
                let mediaHtml = '';
                if (allMedia.length > 0) {
                    const count = allMedia.length;
                    let gridClass = 'one';
                    if (count === 2) gridClass = 'two';
                    else if (count >= 3) gridClass = '';

                    const items = allMedia.slice(0, 6).map(url => {
                        const fullUrl = buildCdnUrl(url);
                        const isVideo = url.match(/\.(mp4|mov|webm)$/i);
                        if (isVideo) {
                            return `<video src="${fullUrl}" muted playsinline loading="lazy"></video>`;
                        }
                        return `<img src="${fullUrl}" alt="媒体" loading="lazy" onclick="openImgModal(this.src)" />`;
                    }).join('');

                    mediaHtml = `<div class="feed-media ${gridClass}">${items}</div>`;
                    if (count > 6) {
                        mediaHtml +=
                            `<div style="font-size:12px;color:var(--text-muted);margin-top:4px;">+${count - 6} 更多</div>`;
                    }
                }

                const modifiedHtml = friend.modified ?
                    `<div class="feed-modified">✏️ 已修改 ${formatDateToMinute(friend.modified)}</div>` : '';

                html += `
                        <div class="feed-item" onclick="window.open('${DETAIL_PAGE}?postId=${encodeURIComponent(friend.id || '')}', '_blank')">
                            <div class="feed-header">
                                <img class="avatar" src="${avatarUrl}" alt="头像" />
                                <div class="meta">
                                    <div class="name">${authorName}</div>
                                    <div class="date">${displayDate}</div>
                                </div>
                            </div>
                            <div class="feed-title">
                                ${friend.title || '无标题'} ${pinnedTag}
                            </div>
                            <div class="feed-content">${contentHtml}</div>
                            ${mediaHtml}
                            ${modifiedHtml}
                        </div>
                    `;
            });

            container.innerHTML = html;
        }

        // ================================================================
        // 图片模态框
        // ================================================================
        function openImgModal(src) {
            if (!src) return;
            const modal = $('imgModal');
            const img = $('modalImg');
            img.src = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImgModal() {
            const modal = $('imgModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeImgModal();
        });

        // ================================================================
        // 启动
        // ================================================================
        loadConfig();
        console.log('🦔 FriendQuan 已启动');
    </script>

</body>
</html>
